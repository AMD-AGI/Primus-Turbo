name: MI355 runner probe

on:
  push:
    branches:
      - ci/mi355-probe
  workflow_dispatch:

jobs:
  probe:
    runs-on: primus-turbo-mi355-tas
    timeout-minutes: 30
    steps:
      - name: Runner container
        run: |
          set -x
          id; hostname; nproc; free -g; df -h / "$GITHUB_WORKSPACE" || true
          ls -l /dev/kfd /dev/dri 2>&1 || true
          df -h /dev/shm
          env | grep -iE "^(POD_NAME|SAFE_|HIP_|ROCR_|AMD_|NVTE_|PRIMUS_)" | sort || true
      - name: Shared storage
        run: |
          set -x
          mount | grep -iE "nfs|shared|wekafs|lustre" || true
          ls -la /shared_nfs 2>&1 | head -30 || true
          df -h /shared_nfs 2>&1 || true
          [ -w /shared_nfs ] && echo "shared_nfs writable" || echo "shared_nfs NOT writable"
      - name: Network
        run: |
          for u in https://github.com https://pypi.org/simple/pip/ https://registry-1.docker.io/v2/ https://harbor.global.primus-safe.amd.com/v2/ https://huggingface.co; do
            printf '%-55s ' "$u"; curl -s -o /dev/null -w '%{http_code} %{time_total}s\n' --max-time 20 "$u" || echo FAIL
          done
      - name: GPU
        run: |
          rocm-smi --showproductname 2>/dev/null | head -20 || amd-smi static -a 2>/dev/null | head -20
          python3 - <<'PY'
          import torch
          n = torch.cuda.device_count()
          print("device_count", n)
          for i in range(n):
              p = torch.cuda.get_device_properties(i)
              print(i, p.name, p.gcnArchName, round(p.total_memory / 2**30), "GiB")
          a = torch.randn(4096, 4096, device="cuda:0", dtype=torch.bfloat16)
          print("matmul ok", float((a @ a).float().abs().mean()))
          PY
