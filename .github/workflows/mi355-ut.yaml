name: MI355 unittest (trial)

on:
  push:
    branches:
      - ci/mi355-probe
  workflow_dispatch:

env:
  # Required aiter release. Keep in sync with AITER_GIT_TAG in primus_turbo/common/aiter_utils.py.
  AITER_VERSION: v0.1.24.post1

jobs:
  unittest-pytorch-gfx950:
    runs-on: turbo-torch-ut-mi355-v2608 # GitHub runner inside rocm/primus:v26.8 on SaFE (Crusoe MI355X)
    timeout-minutes: 300
    steps:
      - name: Clean stale submodule checkout
        run: rm -rf "${GITHUB_WORKSPACE}/3rdparty" "${GITHUB_WORKSPACE}/.git/modules"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Print rocminfo
        run: rocminfo | grep -E "Marketing Name|gfx9" | sort | uniq -c || true
      - name: Install and build
        run: |
          unset AITER_ASM_DIR
          pip3 uninstall -y aiter amd-aiter || true
          SITE_PACKAGES=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          rm -rf "${SITE_PACKAGES}/aiter" "${SITE_PACKAGES}/aiter_meta"
          pip3 install -r requirements.txt
          pip3 install "amd-aiter @ git+https://github.com/ROCm/aiter.git@${AITER_VERSION}"
          GPU_ARCHS="gfx950" PRIMUS_TURBO_FRAMEWORK="PYTORCH" pip3 install --no-build-isolation -e ".[pytorch]" -v
      - name: Run single-GPU tests (parallel)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 135
          max_attempts: 2
          command: >
            timeout -k 60s 130m
            bash -lc
            "exec pytest -v tests/pytorch -n 8 --timeout=600 --timeout-method=thread --max-worker-restart=8 --log-cli-level=INFO"
      - name: Run deterministic tests (parallel)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: >
            timeout -k 60s 55m
            bash -lc
            "exec pytest -v tests/pytorch -n 8 --deterministic-only --timeout=600 --timeout-method=thread --max-worker-restart=8 --log-cli-level=INFO"
      - name: Run distributed tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: pytest -v tests/pytorch --dist-only --timeout=600 --timeout-method=thread --log-cli-level=INFO
