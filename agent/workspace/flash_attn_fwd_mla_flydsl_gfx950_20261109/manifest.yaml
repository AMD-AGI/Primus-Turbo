target_op: flash_attn_fwd_mla_192_128
target_backend: FLYDSL
target_lang: FLYDSL
target_gpu: gfx950
execution_mode: workspace
project_skill: primus-turbo-develop
performance_target: "same-GPU Forward TFLOPS ratio vs Turbo AITER >= 1.0 (geomean over target_shapes)"
primary_metric: "Forward TFLOPS (geomean over PASS shapes); fwd-only, Bwd columns '-'"
target_shapes: >-
  DSV3 MLA, Hq = Hkv = 128, d_qk 192, d_v 128, causal, sbhd bf16:
  B1 S 4K/8K/16K/32K/64K, B2 S 4K/16K
kernel_source:
  - /perf_apps/xiaoming/megaattention_overlap_bench/flydsl_mla/flash_attn_fwd_mla.py
  - /perf_apps/xiaoming/megaattention_overlap_bench/flydsl_mla/attn_helper_mla.py
  - /perf_apps/xiaoming/megaattention_overlap_bench/flydsl_mla/ops.py
test_command: "HIP_VISIBLE_DEVICES=0 python <campaign_dir>/quick_test_bench.py --set full (Check column: O rel vs fp32 <= 3e-3, LSE max abs <= 1e-2)"
benchmark_command: "HIP_VISIBLE_DEVICES=0 python <campaign_dir>/quick_test_bench.py --set full --summary-csv <round_dir>/artifacts/benchmark_full.csv"
quick_command: "HIP_VISIBLE_DEVICES=0 python <campaign_dir>/quick_test_bench.py --set quick --summary-csv <round_dir>/artifacts/benchmark.csv"
representative_shapes: [b1_s4k, b1_s16k, b1_s64k, b2_s4k]
rebuild: "none (FlyDSL JIT; cache_tag / source hash pick up edits)"
run_env: "docker exec xiaoming-dev bash -lc '...' on smci355-ccs-aus-n04-25; GPU 0 pinned for every round"
constraints:
  - "Do not modify existing Primus-Turbo / Megatron / Primus kernels; work only in megaattention_overlap_bench/flydsl_mla/"
  - "No git commit without explicit instruction"
git_commit: false
git_branch: none
max_iterations: null
