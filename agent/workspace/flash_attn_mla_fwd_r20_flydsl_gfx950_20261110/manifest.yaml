target_op: flash_attn_mla_fwd (d_qk 192 / d_v 128, causal, SBHD bf16)
target_backend: FLYDSL
target_lang: FLYDSL
target_gpu: gfx950
execution_mode: workspace
project_skill: primus-turbo-develop
performance_target: "Forward TFLOPS geomean >= 1.40x aiter 0.1.24.post1 (opus gqa_d192_v128), same session, full set"
primary_metric: "Forward TFLOPS (geomean over PASS shapes, full set); forward-only, Bwd columns '-'"
target_shapes: >-
  Hq = Hkv: dsv3 B2 S4K H128, dsv2lite B8 S4K H16, kimik2 B4 S4K H64, kimik3 B2 S7168 H96,
  H128 B1 S4K / 8K / 16K / 32K / 64K, H128 B2 S4K / 16K
representative_shapes: [dsv3, dsv2lite, kimik3, b1_s16k, b1_s64k]
baseline_source: "dev/xiaoming/flydsl_mla_fwd_gfx950 @ 33beb4f8, primus_turbo/flydsl/attention/gfx950_mla/ (forward round 20)"
kernel_source:
  - <campaign_dir>/src/branch_mla/flash_attn_fwd_mla.py
  - <campaign_dir>/src/branch_mla/attn_helper_mla.py
  - <campaign_dir>/src/branch_mla/ops.py
test_command: "python <campaign_dir>/ab_bench.py --cand <campaign_dir>/src/branch_mla --base <last accepted snapshot> --set full (Check: O rel vs fp32 <= 3e-3, LSE max abs <= 1e-2; bitwise vs base reported)"
benchmark_command: "python <campaign_dir>/ab_bench.py --cand <campaign_dir>/src/branch_mla --base <last accepted snapshot> --set full --rot 2 --csv <round_dir>/artifacts/benchmark_full.csv"
quick_command: "python <campaign_dir>/ab_bench.py --cand ... --base ... --set quick"
power_command: "python <campaign_dir>/power_probe.py --kernel <pkg dir>|aiter --shape b1_s16k --secs 10"
rebuild: "none (FlyDSL JIT). Every candidate sets its own CODEGEN_REV in attn_helper_mla.py so cand and base never share a cache entry."
run_env: >-
  docker exec xiaoming-dev, PYTHONPATH=/tmp/aiter_0124:/home/xiaompen/Turbo:/tmp/turbo_overlay
  (aiter 0.1.24.post1, flydsl 0.3.4.1), HIP_VISIBLE_DEVICES=0 (= amd-smi GPU 3), smci355-ccs-aus-n14-17
git_commit: false
