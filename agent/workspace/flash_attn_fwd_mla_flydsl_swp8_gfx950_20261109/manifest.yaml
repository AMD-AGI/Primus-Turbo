  then quick_test_bench.py Check column: O rel vs fp32 <= 3e-3, LSE max abs <= 1e-2
benchmark_command: "HIP_VISIBLE_DEVICES=0 python <campaign_dir>/quick_test_bench.py --set full --summary-csv <round_dir>/artifacts/benchmark_full.csv"
