  att: "rocprofv3 --att ... --kernel-include-regex flash_attn_swp8 --att-target-cu 1 -- python profiles/prof_driver.py swp8 1 16384; profiles/att_stages.py / att_seg.py"
run_env: "docker exec xiaoming-dev bash -lc '...' on smci355-ccs-aus-n04-25; GPU 0 pinned for every round"
constraints:
  - "Do not modify existing Primus-Turbo / Megatron / Primus kernels; work only in megaattention_overlap_bench/flydsl_mla/ (new swp8 files)"
  - "No git commit without explicit instruction"
git_commit: false
git_branch: none
max_iterations: null
