primary_metric: "Forward TFLOPS (geomean over PASS shapes); fwd-only, Bwd columns '-'"
target_shapes: >-
  DSV3 MLA, Hq = Hkv = 128, d_qk 192, d_v 128, causal, sbhd bf16:
  B1 S 4K/8K/16K/32K/64K, B2 S 4K/16K
kernel_source:
  - /perf_apps/xiaoming/megaattention_overlap_bench/flydsl_mla/flash_attn_fwd_mla_swp8.py
  - /perf_apps/xiaoming/megaattention_overlap_bench/flydsl_mla/attn_helper_mla_swp8.py
  - /perf_apps/xiaoming/megaattention_overlap_bench/flydsl_mla/ops_swp8.py
reference_kernels:
