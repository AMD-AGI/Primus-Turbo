why_this_one: >
  The largest predicted prod gain of the round, and the only candidate that tests the premise under all three:
  that the prod gap is the softmax chain running serially with WMMA inside each wave, and that it can be hidden
  in-wave. Its disqualifier, VGPR, was measured in plan: 512, 0 spill, 0 scratch (synthesis_notes.md S1).
  Both agents agreed the order [g13, g14, g15] at 02_review and 04_close.

route_constraint_and_attribution: >
  h22 is a `must` operator item, so it is row 1 of the Route, above g13. r5.i2.g14 discharges it. Act builds
  g14 and g13 as two SEPARATE arms from op/current and measures each against the same control in the same
  3 slot-rotated prod sessions (plus fast and proxy). This is not a bundle: each arm is one change against the
  control, so each number is attributable. NO MERGE this round. g13 sits at exactly 512 VGPR, so a g13+g14
  build is a new compile with a new gate and would be a later round's candidate.
  Ship rule (correction 4): ship the arm with the higher prod vs_champion if it is >= the session floor. Ship
  neither if both are below it. If g14 ships and g13 does not, the selected prediction is recorded as
  falsified. g14's own prediction is judged separately (candidates.yaml).

ship_gate:
  - "prod vs_champion >= the session's measured floor (~0.4%); fast/proxy gains never pay for a prod loss"
  - "spill 0/0, scratch 0; h16 correctness set; h21 bitwise/determinism set for g13; >=49 dB for g14"
  - "clock_probe Mcycles/call and sclk at prod, randn, for control and each arm"

added_to_pool: [r5.i1.g13, r5.i2.g14, r5.i3.g15]

instrument_taken_this_round:
  what: "fast warm vs flushed vs isolated timing, current and beat, one process (the g04 settlement line both agents agreed)"
  where: rounds/005/2-plan/raw/warm_flush/summary.md
  result: >
    Warm back-to-back ratio current/beat: 1.240 and 1.193 in two runs. That is between the agreed thresholds
    (<=1.15 stale, >=1.3 stays), so the agreed line settles neither. L2 temperature is irrelevant
    (qwarm 74.71 vs qflush 75.47 us current; 34.49 vs 34.77 beat). Host launch is equal (16.43 vs 16.60 us).
    About 36 of the ~41 us scored fast gap is a per-dispatch penalty only current pays, and it grows with the
    preceding idle time (38 us back to back, 71 us after a 1.8-ms sleep). That is r1.i3.g03's penalty, now shown
    to be not L2 and not host-side.

