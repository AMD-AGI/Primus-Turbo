prediction_check:
  metric: prod_Mcycles_per_call_randn
  predicted: {from: 1.964, to: "<=1.905"}
  measured: 2.3585           # r4 control same session 1.9601; +20.3%; sclk r5 990 vs r4 974 MHz; 1739 vs 1851 W
  held: false
  measurement: measurements/clock_probe/
  reading: >
    Cycles/call rose 20.3%. The clock was 1.7% higher and power 110 W lower, so this is not a clock
    or power-wall effect: the kernel spends more cycles idle, not doing more work. The static ISA
    was used only as a gate. WMMA 256->352 and ds_load 288->384 are mostly the peeled last tile's
    code copy. s_wait_dscnt 60->112 and s_barrier 12->14 come from the re-phased LDS ring
    [K(i+1)|V(i)]. The likely cause is that softmax(i) VALU was not placed into the gaps of the
    QK(i+1) WMMAs; it was serialised behind the new LDS waits, with no room left at the
    512-VGPR cap. This is NOT confirmed: stall/issue attribution is closed on this chip
    (correction 5), and no trace was taken. Per plan's falsified_if (0 spill, prod vs_champion
    below the floor), L6 at n_block 64 in this implementation shape is closed. It belongs in
    dead_ends, not facts. It does not prove that in-wave overlap cannot pay by another route.

implementation:
  files_changed: [op/flydsl_fwd/fmha_fwd_prefill_a16w16_m32x8.py]
  deviation_from_plan: >
    None in the kernel: pipe1.diff only, byte-identical to plan's compiled probe (md5 3f87cb48;
    gqa4 ISA d530dda8 = plan). Plan compiled gqa4 only; act also compiled gqa2 (512 VGPR, 0 spill).
    Plan's route_constraint asked act to also build r5.i2.g14 as a separate arm. The act rule
    "one candidate" forbids it, so g14 was NOT built or measured. Route row 1 (h22, must) is
    still outstanding. Plan's "3 slot-rotated prod sessions" were replaced by one benchmark.py
    process per shape (palindromic, 101 iters) plus a 3+3-slot alternated clock_probe; the
    slots agree to <0.05%.
  build_failures:
    - {attempt: 1, error: "no ISA dumped; client grep hit 600 s timeout",
       root_cause: "tooling slip: FLYDSL_DUMP_IR=1 missing, grep then read stdin; compile itself rc=0"}
    - {attempt: 2, error: null, root_cause: null}

