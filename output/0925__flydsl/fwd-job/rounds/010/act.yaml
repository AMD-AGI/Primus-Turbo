  # op/ut/test_correctness.py hard-codes GATE_DB = 50.0 (job_context/op/gates.py:21); the spec lowered the
  # gate to 49 dB because the unmodified baseline reads 49.82-49.99 dB on these edge cases. 8 edge cases fail
