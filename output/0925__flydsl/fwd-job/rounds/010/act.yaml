measurements:
  same_session_references: [rounds/004/op, op/beat]   # round 4 = incumbent and champion of every shape
  benchmark: op/benchmark.py
  protocol: >
    raw/s2: 4 sessions; per session one process per shape with exactly two FlyDSL arms
    (champion_r4, candidate; order alternated per session), beat in its own process right after; shape order
    rotated. Values below are medians over the 4 sessions of benchmark.py medians.
  shapes:
    - {name: fast,  this_round_tflops: 54.61,   best_round_tflops: 54.87,   target_tflops: 64.93,
       champion_round: 4, champion_tflops: 54.87,   champion_rebuilt: true, ratio: 0.8411, vs_champion: 0.9943}
    - {name: proxy, this_round_tflops: 928.11,  best_round_tflops: 925.73,  target_tflops: 1021.86,
       champion_round: 4, champion_tflops: 925.73,  champion_rebuilt: true, ratio: 0.9083, vs_champion: 1.0026}
    - {name: prod,  this_round_tflops: 1099.24, best_round_tflops: 1089.76, target_tflops: 1416.18,
       champion_round: 4, champion_tflops: 1089.76, champion_rebuilt: true, ratio: 0.7762, vs_champion: 1.0083}
  score: 0.84186             # champion under the same protocol: 0.84017
  regressions:
    - {shape: fast, vs_champion: 0.9943, within_band: true}
    # per session 1.0041/0.9899/0.9872/0.9959; champion fast itself spans 53.55-55.04 TF (2.7%) across sessions
  noise_floor:
    prod: "champion 1089.13-1090.02 TF across 4 sessions (0.08%); candidate gain +0.83%, every session +0.69..+0.93%"

prediction_check:
  metric: prod_vs_champion
  predicted: {from: 1.000, to: ">=1.007 mean over >=3 rotated sessions, every session >1.003"}
  measured: "1.0083 mean over 4 sessions (1.0086/1.0093/1.0069/1.0084)"
  held: true
  measurement: measurements/pmc_icache_cycles_prod/   # mechanism; the ratio itself is raw/s2/summary.txt
  mechanism_evidence:
    SQC_ICACHE_REQ: 0.9657        # 122.24M -> 118.05M, bit-stable across reps: dynamic instruction stream shrank
    SQC_ICACHE_MISSES: "0 / 0"    # gain is not icache relief
    SQ_BUSY_CYCLES: 0.9911        # clock-independent, agrees with benchmark +0.83%
    GRBM_GUI_ACTIVE: 0.9912
    static_loop: "513 -> 499 insts/tile, s_delay_alu 14 -> 0, VGPR 456, 0 spill (raw/s1/isa_census.txt)"
  reading: >
    Held. Removing the 14 s_delay_alu per tile shortens the executed instruction stream (icache requests -3.4%)
    and cuts ~0.9% of cycles at prod, i.e. about 1/3 of the 2.73% instruction-count cut converts (plan said
    ~1/4). Issue-slot vs fetch-bandwidth attribution is not separable on this chip (no stall counters; closed).
  cell: faster_held

