  confidence: medium
  why: >-
    Issue-bound body (softmax VALU/trans between WMMA phases, h4). Removing 14 delay_alu per tile (nodelay) wins
    about +1% at prod. Removing the post-WMMA arbitration yield (lock_simd) loses 3.5%, so the co-resident wave's
    ability to take the SIMD after a WMMA matters to throughput.

