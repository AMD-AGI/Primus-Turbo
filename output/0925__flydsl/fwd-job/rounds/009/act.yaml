    - "beat-cold probe (raw/beatcold): the cold start is specific to current"
    - "seqlen sweep (raw/seqsweep): the cold start is fixed at +25-42 us, not in the loop; this retired the g16 premise and put g26 at low priority"
    - "compile census amdgpu-loop-prefetch (raw/cc/lpf): inert, closed"
    - "compile census lock/merged (raw/cc/isa_lock, isa_merged): +1 prologue setreg, loop unchanged"
    - "rocprofv3 --stats not re-run (writes no files on this stack; the image is unchanged since r5)"
