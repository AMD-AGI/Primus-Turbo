op:
  type: attention
  config:
    causal: bottom-right           # matches the kernel: `causal_off = kv_len - q_len`
                                   # at fmha_fwd_prefill_a16w16_m32x8.py:762.
    sliding_window: -1             # none, on every shape
    sparsity: dense
    q_head_dim: 128                # fmha_fwd_prefill_a16w16_m32x8.py:109
                                   # SUPPORTED_QK_HDIM = (128, 192, 256)
    kv_head_dim: 128               # fmha_fwd_prefill_a16w16_m32x8.py:2100
                                   # asserts v.shape[-1] == 128
    heads_q_per_kv: 4              # 8/2, 32/8 and 32/8 all give 4
    format: bshd                   # q/k/v/o are [b, s, h, d] in memory; the host
                                   # entry is batched BSHD
                                   # (fmha_fwd_prefill_a16w16_m32x8.py:2073-2074)
    direction: [fwd]               # ⚠ REWRITTEN. The backward spec's comment here
                                   # read "the forward is run to produce o and lse
                                   # and is NOT part of the measured region"
                                   # [bwd-spec:123-125]. That is now exactly
                                   # backwards: THE FORWARD IS THE MEASURED REGION.
                                   # Nothing else is timed -- there is no backward
                                   # pass in this job, no delta kernel, no dq/dk/dv,
                                   # and no host reduction. The measured region is
                                   # one kernel launch producing o and lse.
                                   # Corollary that WILL bite if missed: the FLOP
                                   # counter must be called with backward=False.
                                   # The backward job's benchmark.py hardcodes
                                   # `backward=True` (that job's op/benchmark.py:72-76);
                                   # left as-is here it would report forward
                                   # throughput ~2.5x too high, consistently, and
                                   # nothing would look wrong.
    sink: none                     # sink=None on every shape. The ASM entry takes
                                   # an optional `sink` (aiter/ops/mha.py:596) and
                                   # both arms pass None.
    softmax_scale: head_dim ** -0.5
    softmax_scale_value: 0.08838834764831845   # 128 ** -0.5, written out so no
                                   # stage re-derives it. `softmax_scale=None` in
                                   # the api means this value.
    determinism: >
      The baseline is atomic-free by construction: every output element of o and
      lse is written exactly once. Keep that. A 200-run bitwise gate costs
      nothing on a kernel with no atomic and no split-k, and it is the cheapest
      possible tripwire on a round that tries to buy speed with a reduction.
    determinism_gate: >
      ⚠ REWRITTEN from dq/dk/dv to o/lse. Operationally: no atomics on any
      output, and `o` AND `lse` bitwise identical across 200 consecutive runs at
      the fast-iteration shape. A round that introduces a split-k or atomic
      reduction fails this gate even if it is faster.

      The 200-run count is KEPT, not reduced, and the claim that it costs
      nothing was verified rather than assumed: grepping the whole vendored
      kernel tree for atomics and split-k reductions returns ZERO matches --
      `grep -rn "atomic\|split_k\|splitk\|split-k" --include=*.py` over
      /home/lihuzhan/code/aiter-src/aiter/ops/flydsl/kernels/fmha_gfx1250/
      (fmha_fwd_prefill_a16w16_m32x8.py 2233 L + fmha_b16_buffer_managers.py
      1914 L) produced no output at all, run 2026-09-23.

      ⚠ STILL UNVERIFIED: 200 runs have never actually been executed bitwise on
      this machine. The source-level argument is strong but it is a source-level
      argument. Setup must run the gate once and report the result rather than
      inheriting this sentence as a pass.
    dtype: {qkv: bf16, out: bf16, qk_acc: fp32, softmax: fp32, pv_acc: fp32, lse: fp32}

  reference:
    impl: >
      ⚠ REWRITTEN for the forward. Plain torch, fp32: s = q@k.T*scale;
      bottom-right causal mask; lse = logsumexp(s, dim=-1); p = exp(s - lse);
      o = p@v. Chunk over (batch, head) and query blocks -- a dense
      [4,32,8192,8192] fp32 score tensor is 34 GB.

      This reference ALREADY EXISTS VERBATIM and does not need writing: it is
      `forward_reference` at
      /home/lihuzhan/code/2026_0910__op-evolve/op-evolve/artifacts/
        gfx1250-flydsl-attn-bwd-20260917-115934/job_context/op/ut/common.py:53-82
      (q_chunk=1024, `shift = skv - sq` for bottom-right, natural-log lse,
      o cast to bf16, returns `(o, lse)` at :82). It was written for the backward
      job because that job's reference needed an o and an lse of its own; here it
      IS the reference. Copy that function; do not re-derive it. Nothing else
      from that op/ directory should be copied wholesale -- see the note on
      `core` / `core.gpu` in NOTES.md.
    impl_dtype: fp32               # the reference computes in fp32 and the bf16
                                   # candidate is scored against it.
    logic: >
      Grouped-query flash attention FORWARD, causal bottom-right, bf16, no sink,
      no sliding window, no dropout. Consumes q, k, v and returns o and lse.
    api: >
      ⚠ REWRITTEN for the forward, and the ATTRIBUTE NAME CHANGES WITH IT.

        attn_fwd(q, k, v, softmax_scale=None, causal=True) -> (o, lse)

      q/k/v/o are [b, s, h, d]; lse is [b, hq, sq] fp32 NATURAL log (measured on
      the backward job: aiter's gfx1250 forward emits natural log, ratio 1.0000,
      81.85 dB) [bwd-spec:153-156].

      *** EVERY IMPL MUST EXPOSE THE SAME ATTRIBUTE NAME, AND THAT NAME IS NOW
      `attn_fwd`. *** The loader does a hardcoded
      `fn = getattr(mod, "attn_bwd", None)` at op/ut/common.py:104 and raises
