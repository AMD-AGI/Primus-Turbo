# ------------------------------------------------- WHAT IS DIFFERENT HERE --
#
# The backward job's premise was a ~93x gap to its anchor against a deliberately
# unoptimised first-draft baseline that WE wrote [bwd-spec:19-21,30-40]. Every
# clause of that premise is false here, and three fields below are set
