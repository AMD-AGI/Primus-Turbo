      copied from that document:
        2.19929e12 FLOP / 2.356e-3 s = 9.3350e14 = 933.5 TFLOP/s
      verified with `python3 tools/op_flops.py attention --batch 4 --seqlen 8192
      --heads 32 --kv-heads 8 --head-dim 128 --causal bottom-right --dtype bf16
      --seconds 0.002356` -> "TFLOPS 933.5".
      ⚠ STAGE2-FWD-SWEEP.md prints 947.8 TF/s for the same 2.356 ms because its
      harness uses a slightly larger FLOP count (~2.233e12). This spec uses the
      canonical tool's number throughout so that every figure in the job is
      commensurable. The TIME is the measurement; the TF/s is a derived unit.

  precision_sqnr_db: 50
  refcache: >
    op/refcache/<shape>.pt holds `o` and `lse` ONLY -- no dq/dk/dv; this is a forward job.
    WHERE THE REFERENCE IS STILL NEEDED: exactly ONE validation call site,
    check_correctness, at all three shapes, plus op/ut/test_correctness.py.
    It is NOT needed by the determinism gate (a forward's inputs are q,k,v, and the
    200-run gate compares the candidate's own o/lse against itself) and NOT needed by
    benchmark.py at all -- the backward needed it there only because o and lse were the
    backward's INPUTS. So the fp32 reference leaves every round's timing subprocess.
    ⚠ WHY IT IS WORTH BUILDING, stated from measurement rather than from the backward
    job's history. The backward spec justified refcache by saying the prod-shape fp32
    reference faults this card, and on 2026-09-22 it did cost a power cycle. THAT
    JUSTIFICATION NO LONGER HOLDS AS WRITTEN: on 2026-09-24, with
    HIPBLASLT_TENSILE_LIBPATH set (see runtime.env), the same call at prod ran clean in
    0.88 s, three consecutive times, bitwise identical across separate processes
    (o=7b0249a1cd82 lse=6fa4e0af2ed0). The original fault was the Tensile library
    load-failure path, not the arithmetic.
    What DOES remain, also measured that day: this machine emits intermittent non-fatal
    GPU page faults at small sub-4GB addresses during otherwise-correct runs, and
    occasionally one of them IS fatal to its process. A cached reference removes that
    one remaining exposure from the gate for about 1 second per round of saved compute,
    so build it -- but do NOT repeat the claim that the reference itself faults.
    HOW: adapt Primus-Turbo/tools/gfx1250/build_refcache.py -- drop its
    load_impl(OP/"eager") and the dq/dk/dv tensors, keep forward_reference and the
    provenance block (shape, dims, seed, sha256 of eager/impl.py and ut/common.py).
    ⚠ And keep any helper the cache needs OUTSIDE those two hashed files: the backward
    job learned this the hard way (op/refcache_util.py:3-12), and it is why a later
    poison_allocator fix could be shipped as op/poison_util.py without invalidating a
    single cache entry.
  precision_gate: >
    ⚠ REWRITTEN for the forward. `o` and `lse` are checked SEPARATELY, each
    >= 50 dB against the fp32 reference (op.reference.impl), with the output
    buffers NaN-prefilled and full `isfinite` coverage asserted BEFORE SQNR is
    computed. A run that reports one tensor only, or computes SQNR over a
    partly-uncovered buffer, does not satisfy this gate.

    The backward spec justified the two-tensor rule with a 2026-09-16 precedent
    (out 53.67 / dq 52.24 / dk -inf / dv -inf would have passed a one-tensor
    check) [bwd-spec:168-174]. ⚠ THAT PRECEDENT IS DROPPED: it is about dk/dv,
    which do not exist in this job, and quoting it here would be borrowing
    someone else's evidence. The RULE is kept on its own merits -- an
    uncovered-buffer -inf is a class of bug, not a backward-specific one, and
    the NaN-prefill machinery already exists (`poison_allocator`, op/ut/common.py
    just after :104).

    For calibration, not as the gate: the in-session A/B on 2026-09-23 measured
    the FlyDSL forward's `o` at 51.63-51.69 dB and the ASM forward's at 53.62 dB
    against the same fp32 reference (STAGE2-FWD-SWEEP.md, first and second
    tables). 50 dB therefore has roughly 1.6 dB of headroom on the baseline
    arm -- it is a real gate, not a formality, and a round that costs 2 dB
    fails it.
    ⚠ OPEN: the 50 dB threshold was chosen for a bf16 tensor. `lse` is fp32 and
    a natural log; SQNR on it is numerically well-defined but is not the same
    quantity as SQNR on bf16 `o`, and whether 50 dB is the right bar for it is
    UNVERIFIED. Setup must report the measured baseline lse SQNR alongside the
    o SQNR at round 0 so the operator can retune the threshold once with a
    number in hand.

  shape:
    mode: sweep                    # all three shapes scored, none is a guard
    shapes:
      # ⚠ ALL SIX NUMBERS RECOMPUTED. The backward spec's flop/bytes_min
      # [bwd-spec:181-186] were generated with `--backward` and are 2.5x and 2x
      # the forward values respectively; reused as-is they would inflate every
      # TFLOP/s in this job by 2.5x, uniformly and invisibly.
      #
      # Regenerated 2026-09-23 with, for each shape:
      #   python3 /home/lihuzhan/code/2026_0910__op-evolve/op-evolve/tools/op_flops.py \
      #       attention --batch B --seqlen S --heads HQ --kv-heads HKV \
      #       --head-dim 128 --causal bottom-right --dtype bf16
      # (no --backward). The tool does not touch the GPU. Real output pasted:
      #
      #   === --batch 1 --seqlen 1024 --heads 8 --kv-heads 2
      #   op               attention_fwd
      #   shape            b=1 h=8 kvh=2 sq=1024 skv=1024 d=128 causal=bottom-right window=none live=0.5005 bf16
      #   flop             2.14958e+09  (2.150 GFLOP)
      #   bytes_min        5.24288e+06  (5.243 MB)
      #   intensity_max    410.00 FLOP/byte  -- the op's ceiling, a kernel sits at or below it
      #
      #   === --batch 1 --seqlen 4096 --heads 32 --kv-heads 8
      #   op               attention_fwd
      #   shape            b=1 h=32 kvh=8 sq=4096 skv=4096 d=128 causal=bottom-right window=none live=0.5001 bf16
      #   flop             1.37473e+11  (137.473 GFLOP)
      #   bytes_min        8.38861e+07  (83.886 MB)
      #   intensity_max    1638.80 FLOP/byte  -- the op's ceiling, a kernel sits at or below it
      #
      #   === --batch 4 --seqlen 8192 --heads 32 --kv-heads 8
      #   op               attention_fwd
      #   shape            b=4 h=32 kvh=8 sq=8192 skv=8192 d=128 causal=bottom-right window=none live=0.5001 bf16
      #   flop             2.19929e+12  (2199.292 GFLOP)
      #   bytes_min        6.71089e+08  (671.089 MB)
      #   intensity_max    3277.20 FLOP/byte  -- the op's ceiling, a kernel sits at or below it
      #
      # Cross-check on the ratios to the backward values, as a guard against a
      # transcription error: 5.37395e9/2.14958e9 = 2.500, 3.43681e11/1.37473e11
      # = 2.500, 5.49823e12/2.19929e12 = 2.500 (FLOP), and 2.000 exactly on all
      # three bytes_min. Both ratios are the textbook ones.
      - {batch: 1, seqlen_q: 1024, seqlen_kv: 1024, heads_q: 8,  heads_kv: 2, head_dim: 128, note: fast-iteration,
         flop: 2.14958e+09, bytes_min: 5.24288e+06}
      - {batch: 1, seqlen_q: 4096, seqlen_kv: 4096, heads_q: 32, heads_kv: 8, head_dim: 128, note: quarter-FLOP proxy,
         flop: 1.37473e+11, bytes_min: 8.38861e+07}
      - {batch: 4, seqlen_q: 8192, seqlen_kv: 8192, heads_q: 32, heads_kv: 8, head_dim: 128, note: production,
         flop: 2.19929e+12, bytes_min: 6.71089e+08}
  guards: []                       # none. Every shape above is scored.

  target:
    # *** DO NOT REWORD THE `beat:` LINE WITHOUT KEEPING THE SUBSTRING
    # *** "beaten by N%" IN IT. op_evolve/core/tune.py:32 parses it with
    # ***   MARGIN = re.compile(r"(beaten by\s+)(\d+(?:\.\d+)?)(\s*%)")
    # *** and `op-evolve tune --beat-margin` rewrites exactly that capture.
    # *** validation reads the same line. A reword that keeps the prose and
    # *** loses the number is a silently wrong gate, which is the defect that
    # *** command exists to prevent (tune.py:9-15).
    beat: "aiter prebuilt gfx1250 ASM forward, aiter.ops.mha.fmha_fwd_with_sink_asm (aiter/ops/mha.py:589), sink=None -- must be beaten by 0%"
    beat_note: >
      ⚠ NO HAND-WRITTEN LAUNCHER IS NEEDED, unlike the backward.
      `op.target.beat_launcher` in the backward spec pointed at
      Primus-Turbo/tools/gfx1250/asm_bwd_launcher.py [bwd-spec:190]; that field
      is DELETED here and has no forward equivalent. The backward needed one
      because aiter's Python arch gate does not reach the gfx1250 backward
      kernels. The forward has a public Python entry point already:
        def fmha_fwd_with_sink_asm(q, k, v, softmax_scale, is_causal,
                                   return_lse, sink=None, out=None)
            -> tuple[Tensor, Tensor]          # aiter/ops/mha.py:589-598
      and the gfx1250 code object is already on disk:
        /home/lihuzhan/code/aiter-src/hsa/gfx1250/fmha_fwd_bf16/
            fmha_bf16_pertokenBf16_hd128_128x256_mask.co
      (verified present 2026-09-23, alongside the non-mask variant and the hd64
      pair; the varlen tree carries its own _varlen.co).
      The mask variant is the one this job's causal shapes select.
      A working two-arm harness that already wires FlyDSL-forward against
      ASM-forward with ABAB interleaving, a clock witness and NaN coverage
      exists and should be the blueprint for op/beat/ and op/baseline/:
      Primus-Turbo/output/0917__flydsl/bin/stage1_fwd_ab.py:20-21.
      ⚠ op/beat/ NEEDS ITS OWN _env.py, AND IT IS NOT THE BASELINE'S.
      runtime.python_path is documentation: nothing in the framework applies it
      (grep -rn python_path over op_evolve/ and tools/ returns nothing). Each arm
      sets its own sys.path. op/baseline/_env.py deliberately OMITS
      /home/lihuzhan/code/aiter-src, so the vendored tree cannot silently reach the
      installed package. op/beat/ is the opposite case -- it IS the installed
      package -- so op/beat/_env.py MUST insert /home/lihuzhan/code/aiter-src on
      sys.path before `from aiter.ops.mha import fmha_fwd_with_sink_asm`.
      Note aiter/ops/mha.py:571-575 decorates that entry with
      @compile_ops(..., ffi_type="ctypes"): the FIRST call JIT-builds a C++ module.
      Build it at import or at first call, OUTSIDE every timing region, and report
      the build time.
    beat_margin_pct: 0             # "by 0%" -- parity with the ASM forward is
                                   # the bar, matching job.description. Note this
                                   # is a HARDER 0% than the backward's: the
                                   # forward starts 1.513x behind, so parity means
                                   # finding 51%. It is deliberately not softened
                                   # to a number the job could reach by accident;
                                   # `op-evolve tune --beat-margin` can move it
                                   # later without a spec bump.
    beat_measured_same_run: true   # KEPT, and for the same reason
                                   # [bwd-spec:194-198]: the anchor is re-measured
                                   # in the same run as the candidate, never read
                                   # from a stored figure. This card is
                                   # VR-throttled and DRIFTS (1100 -> 967 MHz
                                   # inside one timing window), so a stored anchor
                                   # turns clock drift into apparent progress.
                                   # Independently confirmed for the forward:
                                   # the SAME code drifted about 1.5% across
                                   # sessions on 2026-09-23.
    beat_reference_figure: >
      ⚠ REPLACED. The backward's figure (10.160 ms ~= 541.2 TFLOP/s on
      5.49823e12 FLOP) [bwd-spec:199-202] is a backward number and does not
      carry.

      FORWARD, measured on this card on 2026-09-23: aiter's prebuilt gfx1250 ASM
      forward runs 1.557 ms MEDIAN at the production shape over 101 interleaved
      reps, per-arm sd 1.39%, `o` at 53.62 dB.
      2.19929e12 FLOP / 1.557e-3 s = 1.41253e15 = 1412.5 TFLOP/s (from
      tools/op_flops.py --seconds 0.001557, "TFLOPS 1412.5"). Against the
      baseline's 2.356 ms that is a ratio of 1.513x.
      Source: output/0923__flydsl/STAGE2-FWD-SWEEP.md.

      This is a SANITY figure only -- it is NOT the gate. The gate is the
      same-run measurement (beat_measured_same_run above).
    tflops: null            # MUST stay null, or _margin() returns None and the
    roofline_pct: null      # relative gate is silently disabled.
                            # ⚠ And on this machine roofline_pct has a second
                            # reason to stay null: the card's true bf16 peak has
                            # never been measured. Every "distance to the roof"
                            # statement in this campaign rests on one Triton bf16
                            # GEMM result (1002.7 TF/s) that the ASM forward
                            # already exceeds by 1.398x. Until a real peak is
                            # pinned, quote no absolute ceiling.
                            # (output/0923__flydsl/STAGE2-S0-PROBE.md, "仍然未钉死")
  backend: [flydsl]         # PINNED. The candidate is a FlyDSL program.

evolve:
  max_rounds: 30   # [2026-09-25] raised from 12: deep every 5th round, extend with tune if still gaining.
  # ⚠ REDUCED from the backward's 40 [bwd-spec:209]. That 40 was justified by an
  # UNMINED search space against a first-draft baseline at a ~93x gap
  # [bwd-spec:19-21,211-215]. Neither clause holds here: the baseline is aiter's
  # shipped kernel, and three directions in it were already measured and closed
  # on 2026-09-23 before this job existed (the n_block sweep, the joint
  # (BLOCK_M, n_block) sweep, and the 4-wave roadblock -- see the header).
  # What is left is ONE confirmed free win (O_VARIANT v1, +1.90%) and TWO
  # untried structural levers (deep unroll / software pipelining of the KV loop;
  # dispatch order, which the backward's round 12 turned into 14%). Twelve
  # rounds is enough to land the free win, attempt both levers with a deep round
  # on each, and produce a measured refutation if they do not pay. Spending 40
  # rounds of single-card time re-searching a family already pinned as a local
  # optimum is exactly the failure the backward spec warned about
  # [bwd-spec:23-26].
  max_timeout: 120h         # = 172800 s. Unchanged [bwd-spec:210]; 12 rounds
                            # will not reach it, and it is a backstop, not a plan.
  min_gain: 0.007  # [2026-09-25] just above this operator's 0.24-0.66% same-session noise floor.
  # [stage2, 2026-09-23] LOWERED from an earlier draft's 0.015. That value was set
  # from the ~1.5% drift the same code showed ACROSS sessions, but cross-session drift is
  # not the noise this gate sees: `beat_measured_same_run: true` measures every arm in one
  # process, and acceptance compares medians of 101 reps taken interleaved, where drift is
  # common-mode and cancels. The relevant spread is the standard error of a
  # median-of-101 against a per-rep sd of 1.17-1.39%, which is a few tenths of a percent.
  # 0.005 sits several times above that and still well under the one forward win confirmed
  # so far (O_VARIANT v3->v1, +1.90% over 101 reps in two independent sessions).
  # At 0.015 a real 1% improvement would have been rejected as noise, and on a 1.51x gap
  # that is the wrong error to prefer: the forward's gains will be single-digit percents,
  # not the integer factors the backward saw. Measurements:
  # output/0923__flydsl/STAGE2-FWD-SWEEP.md.
  # NOTE min_gain is NOT tunable with `op-evolve tune` -- changing it later needs
  # `resume --config`, which bumps spec_version and rebuilds op/. Get it right now.
  # ⚠ RAISED from the backward's 0.0 [bwd-spec:211-215]. That 0.0 was justified
  # by "the gap to the anchor is ~93x, so round gains are expected to be integer
  # factors, far above this machine's run-to-run spread". The gap here is 1.513x
  # and gains are single-digit percentages, so 0.0 would let noise walk the
  # champion upward and force every later round to beat the noise too -- the
  # exact failure core/spec.py:79-86 records from turbo-flydsl-attn-bwd-dense.
  #
  # WHICH MEASUREMENT THIS NUMBER COMES FROM, explicitly: it is set from the
  # SAME-CODE CROSS-SESSION DRIFT of about 1.5% observed on 2026-09-23 -- the
  # identical FlyDSL forward, unchanged, measured in two independent sessions --
  # NOT from the per-rep spread. The per-rep spread is the smaller of the two
  # numbers and would have given a lower floor: per-arm sd over 101 reps was
  # 1.17% (O_VARIANT=v1), 1.21% (v3) and 1.39% (ASM). Both are recorded in
  # output/0923__flydsl/STAGE2-FWD-SWEEP.md. 0.015 sits just above the larger.
  #
  # ⚠ A READER MAY REASONABLY DISAGREE, and NOTES.md argues both sides. The
  # short version: the median of 101 reps is far tighter than one rep's sd, and
  # `beat_measured_same_run: true` means both arms move together, so a
  # within-round RATIO cancels most of the session drift -- on that reading a
  # floor near 0.005 would be defensible and 0.015 rejects the known-real
  # O_VARIANT win of 1.90% by only 0.4 points of margin. It is set at 0.015
  # anyway because the drift is the only spread that has actually been observed
  # to move this kernel's number with no code change, and a champion walked
  # upward by drift is unrecoverable without re-running every round, whereas a
  # real win rejected at round N is simply re-proposed at round N+1.
  # ⚠ NOT tunable with `op-evolve tune`: that command exposes only
  # --fast-rounds/--fast-per-deep/--max-rounds/--max-timeout/--beat-margin/
  # --target-tflops (cli.py:76-86). Changing min_gain means a hand edit of the
  # resolved yaml.
  turn_timeout: null        # unset: each module keeps its own default (3 h).
  schedule:
    fast_rounds: 4   # [2026-09-25] rounds 1-4 fast, 5 deep, 6-9 fast, 10 deep, ... (schedule.py: D first in each cycle)
    # ⚠ REDUCED from the backward's 40 [bwd-spec:217-218], whose comment was
    # "single card: deep rounds cannot parallelise, so front-load". The single
    # card is still true, but the OTHER half of that argument has expired: on
    # 2026-09-17 the profiling modules were under a blanket ban on this card and
    # a deep round was mostly wasted. On 2026-09-23 that ban was lifted -- six
    # rocprofv3 runs, all rc=0, clean KFD, zero page faults -- with the single
    # caveat that only `--pmc` produces data (`--kernel-trace` records zero
    # dispatches) and it costs about 2 minutes per counter group
    # (STAGE2-S0-PROBE.md, S0-c). A deep round is now worth its cost, and the
    # two remaining levers (deep unroll, dispatch order) are precisely the kind
    # that need counters rather than guesses. So: 6 fast rounds to land the free
    # win and re-establish the arms, then deep rounds enter the cycle.
    fast_per_deep: 4        # then fast, fast, fast, deep, repeating -- tighter
                            # than the backward's 5 [bwd-spec:219], same reason.
  # ⚠ ALL THREE of max_rounds, fast_rounds and fast_per_deep are TUNABLE LATER,
  # in place, with `op-evolve tune --job <name>-<id> --max-rounds N
  # --fast-rounds N --fast-per-deep N`. That command writes the final yaml ONLY,
  # never state.yaml, so it does NOT bump spec_version and does NOT trigger a
  # setup re-run (tune.py:19-22). A bump would make both setup stages look
  # incomplete and the setup agent would rewrite op/baseline, op/eager, op/ut,
  # op/benchmark.py and op/validation.py over any hand patches. So these initial
  # values do not have to be right the first time -- they only have to be small
  # enough that being wrong is cheap. Precedent: this was done on the backward
  # job itself on 2026-09-23 (`--max-rounds 40 --fast-rounds 40`, spec_version
  # stayed v000, refcache and hand patches intact -- STAGE2-S0-PROBE.md, S0-a).

runtime:
  # ⚠ CARRIED OVER UNCHANGED from [bwd-spec:221-303] except where marked. Same
  # host, same container, same card, same interpreter. Nothing about the
  # direction of the pass changes any of it.
  runner:
    type: docker            # LOCAL docker. There is no `runtime.runner.ssh`
                            # block: the controller, the node and the container
                            # are all on heliosr-1b114-c07-1, so ZERO ssh hops.
    ssh: null
    docker:
      image: null                   # unused: `container` is set, so the runner
                                    # attaches and never creates. The running
                                    # container's image is `fa-tune:deps`,
                                    # recorded for provenance only -- do NOT move
                                    # it into this field, which would make the
                                    # runner own the container.
      container: fa-repro           # EXISTING container; the runner attaches,
                                    # never recreates. flydsl 0.3.2 is at
                                    # /home/lihuzhan/.local/flydsl032. Mounts
                                    # /home/lihuzhan:/home/lihuzhan, /dev/kfd + /dev/dri,
                                    # ipc=host, net=host, shm 16 GiB,
                                    # seccomp=unconfined, groups video,993.
                                    # ⚠ THE SAME container the backward job is
                                    # attached to. See the ONE GPU banner.
      options: []                   # none are applied: `options` is only read
                                    # when the runner CREATES a container.
      owned: false                  # user-owned container. The runner must not
                                    # create, recreate, restart or pip-install
                                    # into it.
  sudo: false               # policy, not capability: `sudo -n true` SUCCEEDS on
                            # this host, and it stays false anyway.
  gpu_arch: gfx1250         # rocm-smi GFX Version gfx1250,
                            # rocminfo amdgcn-amd-amdhsa--gfx1250,
                            # torch gcnArchName gfx1250.
                            # AMD Eng Sample 100-000001046-04.
  gpu_id: 0                 # the only GPU on the node (device count 1)
  gpu_pool: []              # ⚠ ONE card on this host. Not a placeholder. Deep
                            # rounds cannot parallelise their analyses. AND this
                            # job cannot coexist with
                            # gfx1250-flydsl-attn-bwd-20260917-115934 -- see the
                            # banner at the top of this file.
  host: heliosr-1b114-c07-1
  python_path:              # prepend IN THIS ORDER before `import flydsl` / `import aiter`
    - /home/lihuzhan/.local/flydsl0341    # flydsl 0.3.4.1 (2026-09-25; A/B vs 0.3.2 at prod: fly/asm 0.6638 vs 0.6602, i.e. no regression)
    - /home/lihuzhan/code/aiter-src       # aiter is NOT installed in the container
  env:
    TORCH_BLAS_PREFER_HIPBLASLT: '1'
    HIPBLASLT_TENSILE_LIBPATH: /home/lihuzhan/.local/hipblaslt-gfx1250/gfx1250
    # ⚠ CARRIED OVER AT '1', WHICH IS WHAT KEEPS ALL ARMS IDENTICAL. Both values
    # are "identical across arms" in the trivial sense -- the runner exports one
    # value to every process -- so the choice is which value is SAFE, and on
    # 2026-09-23 that became '1'.
    #
    # WHAT WAS ESTABLISHED ON 2026-09-23 (output/0923__flydsl/STAGE2-S0-PROBE.md,
    # section S0-b): THE IMAGE'S hipBLASLt IS NOT BROKEN. The v000 diagnosis --
    # "this image has no gfx1250 Tensile library" -- was WRONG. What is actually
    # true is that hipBLASLt's DEFAULT SEARCH PATH merely lacks the gfx1250
    # payload. There are THREE hipBLASLt library directories in this container
    # and only one usable set:
    #   * /opt/rocm/lib/hipblaslt/library -- empty, and a decoy: this container's
    #     ROCm is not at /opt/rocm at all.
    #   * _rocm_sdk_libraries_gfx1250/lib/hipblaslt/library -- hipBLASLt's
    #     DEFAULT search path, and it lacks the gfx1250 payload. THIS, not a
    #     missing library, is what made HIPBLASLT_TENSILE_LIBPATH-unset raise
    #     HIPBLAS_STATUS_INVALID_VALUE.
    #   * _rocm_sdk_devel/lib/hipblaslt/library/gfx1250 -- 326 files but
    #     INCOMPLETE (no Kernels.so-000, no extop/transform, .dat not unzipped).
    #     Pointing LIBPATH here SIGSEGVs (exit 139).
    # Setting HIPBLASLT_TENSILE_LIBPATH=/home/lihuzhan/.local/hipblaslt-gfx1250/gfx1250
    # -- the host's complete 328-file ROCm 10.1.0 library, copied under $HOME,
    # the only bind mount -- MAKES IT WORK. Measured clean on 2026-09-23: bf16
    # and fp32 GEMM at 512/2048/4096, and the fp32 QK^T [2,16,4096,128] shape the
    # precision gate used to fault on. Zero rocblaslt errors, zero dmesg faults.
    # It was NOT re-run under the old '0' configuration: that would be
    # deliberately reproducing a wedge.
    #
    # ⚠ AND IT WILL NOT STICK UNLESS IT IS SET EXPLICITLY.
    # /usr/lib/python3.12/sitecustomize.py:18 does
    # `setdefault("TORCH_BLAS_PREFER_HIPBLASLT","0")` at EVERY interpreter
    # startup, before any project code. The backward job's `op/*/_env.py` also
    # used `setdefault`, so for twelve rounds it was a no-op and nobody noticed.
    # `docker exec` runs `bash -c` and does not read profile, so
    # /etc/profile.d/zz-gfx1250.sh never participated either. Setup must ASSIGN
