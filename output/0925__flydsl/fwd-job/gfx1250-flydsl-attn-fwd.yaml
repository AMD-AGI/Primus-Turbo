job:
  name: gfx1250-flydsl-attn-fwd   # was `gfx1250-flydsl-attn-bwd` [bwd-spec:67].
                                  # This name determines the artifacts directory and the
                                  # `<name>_final.yaml` filename (job.py:76-77,
                                  # job.py:199), so it must differ from the
                                  # backward job's or the two collide on disk.
  # id / started_at are NOT set here: the framework resolves them at
  # `op-evolve run`. The backward spec carries them [bwd-spec:68-69] because it
  # is a COMPLETED spec; this one is an input.
  description: >
    aiter's gfx1250 FlyDSL flash-attention FORWARD prefill kernel
    (fmha_fwd_prefill_a16w16_m32x8, 2233 lines), optimised against aiter's OWN
    prebuilt gfx1250 ASM forward. bf16, head dim 128, causal bottom-right, BSHD,
    GQA 4:1, no sink, no sliding window.

    Measured on this card on 2026-09-23, same session, ABAB-interleaved, 101
    reps, 8 s warmup, at the production shape b=4 sq=skv=8192 hq=32 hkv=8 d=128:
    the FlyDSL forward runs 2.356 ms median (933.5 TFLOP/s on 2.19929e12 FLOP)
    and the ASM forward runs 1.557 ms median (1412.5 TFLOP/s). The gap is
    1.513x. Per-arm run-to-run sd was 1.17-1.21%.

    The job's question is whether a SOURCE-LEVEL FlyDSL forward can reach the
    prebuilt ASM forward. The backward job's framing applies unchanged here:
    a well-measured refutation is a result, and the operator would rather have
    it in a dozen rounds than forty [bwd-spec:88-90]. What is already known
    about where the gap is NOT: it is not the tile aspect ratio (a five-point
    (BLOCK_M, n_block) sweep pinned the shipped point as a local optimum) and
    it is not the mathematics (blocked causal costs only 0.78% extra). The one
    structural difference left standing is that the ASM bar runs 4 waves at
    1024 VGPR each -- 1024/1024 VGPR per SIMD -- against the FlyDSL kernel's
    8 waves at 224 VGPR -- 448/1024 per SIMD. The bar holds 2.3x more state in
    registers. Both use the full 327680 B of CU LDS and neither spills
    (scratch=0). See output/0923__flydsl/STAGE2-FWD-SWEEP.md.

