#   3. The search space is NOT untouched. Three directions were measured and
#      closed in-session on 2026-09-23 before this spec was written, and the
#      planner should not re-mine them:
#        * n_block 64 -> 128 -> 256 alone: 3.2x and 9.9x SLOWER (VGPR spill,
