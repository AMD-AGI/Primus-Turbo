job:
  name: gfx1250-flydsl-attn-bwd        # [user]
  id: '20260917-115934'                # [resolved] from the framework
  started_at: '2026-09-17T11:59:34'    # [resolved] from the framework
  description: >
    A first-party FlyDSL flash-attention BACKWARD for gfx1250, written 2026-09-17,
    correct and unoptimised. Three kernels: odo (delta), dkdv (dV and dK in one pass),
    and dq. bf16, head dim 128, causal bottom-right, BSHD. The anchor is aiter's
    prebuilt gfx1250 ASM backward, which does the production shape in 10.160 ms
    (~540 TFLOP/s useful at this card's 1100 MHz VR-throttled clock) against the
    baseline's ~5.8 TFLOP/s.

    The motivation is NOT that FlyDSL is expected to be faster. A like-for-like forward
    comparison on this card measured aiter's FlyDSL forward 1.51x SLOWER than its own
    prebuilt ASM forward, with both sides mature -- that is the best available estimate
    of what these gfx1250 FlyDSL idioms are worth, and parity is the realistic ceiling
    for the backward too. What a source-level backward buys instead is: gfx1250 has NO
    varlen ASM backward at all (an existence gap, not a speed one); the ASM backward
    carries a GQA out-of-bounds write worked around with 1.254 GiB of peak scratch and
    a host reduction costing 5.2% of the backward; and gfx1250 ships 6 backward .co
    against gfx950's 124.

    So the job's real question is whether an optimised FlyDSL backward can REACH the
    ASM backward, not beat it by a margin. A well-measured refutation is a result, and
    the operator would rather have it in ten rounds than forty.

