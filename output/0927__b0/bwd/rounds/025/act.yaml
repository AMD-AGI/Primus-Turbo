# ---------------------------------------------------------------- the prediction
prediction_check:
  metric: prod_vs_champion_same_session
  predicted: {from: 1.000, to: ">= 1.030"}
  measured: 0.9656
  held: false
  measurement: measurements/kdkdv_locus_g3/
  reading: >
    The regression is ISSUE/FETCH-SIDE, not the predicted memory-side effect.
    SQC_ICACHE_REQ for k_dkdv grew +15.22% (275,152,320 -> 317,021,440, zero spread over five
    dispatches), while k_delta_bshd and k_dq -- the two kernels g77 did not touch -- are
    BIT-IDENTICAL between arms. The memory instruction mix did not change at all: 160
    buffer_load_b128, 176 loads, 128 wmma in both. All static growth is 102 extra
    s_set_vgpr_msb bank prefixes, +19/+16 instructions in the two hot bodies, and 6 -> 7
    blocks -- every one of which the candidate predicted would NOT happen ("k_dkdv_body_isa:
    identical except the loop bound, the address prologue, and _ldqd's argument sign").

    Consequence for round 26: g77 DOES NOT TEST the L2 phase-alignment hypothesis. It carries
    a 15.22% fetch perturbation the hypothesis never called for, so its loss is confounded
    and refutes nothing on that axis. The only clean evidence bounding that family is P77,
    the independent throwaway probe: 1.83% raw, ~0 clock-normalised.

    NOT claimed: that the +15.22% fetch growth CAUSED the +7.22% profiled duration growth.
    Campaign correction 3 forbids that conversion and it is not made. No cache-hit or traffic
    counter exists on this part at any memory level (TCC/TCP/TA/TD absent; CHC/GL1C/CHA/
    GLARBC accepted and read exactly zero), so the memory-side half is UNMEASURABLE, not
    refuted.
  cell: slower_failed
  also_expect:
    - {row: "qmask_probe_delta_prod >= 5%  (PRIMARY falsifier)", outcome: failed,
       measured: "1.83 percent raw, about 0 clock-normalised; the pinned arm clocked 3.2 percent higher, sclk 1876 vs 1819"}
    - {row: "k_dkdv_body_isa identical but for bound/prologue/sign", outcome: failed,
       measured: "+19 and +16 instrs, 6 -> 7 blocks, s_set_vgpr_msb 393 -> 495"}
    - {row: "last_prefetch_load_index_in_body unchanged", outcome: failed, measured: "189 -> 192"}
    - {row: "prod_B1 >= 1.5x the end-to-end delta (backfill test)", outcome: sign_inverted,
       measured: "B=1 -5.57%, B=2 -3.01%, B=4 -1.80%: magnitude 3.1x, but WORST where alignment is cleanest"}
    - {row: "fast inside floor (h5)", outcome: failed, measured: "+12.35 percent vs champion on GPU 3"}
    - {row: "spill: 0", outcome: held, measured: 0}
    - {row: "wmma_per_body: 64", outcome: held, measured: 64}

# ---------------------------------------------------------------- what actually got built
implementation:
  files_changed: [rounds/025/op/kernels.py, rounds/025/op/impl.py]
  summary: >
    k_dkdv's q loop walks its query pairs from the TOP of the range downwards instead of
    upwards. Four surgical replacements in kernels.py, each applied under an
    `assert s.count(old) == 1`: qloop_mask's induction variable, qloop_full's consumed AND
    g62 depth-2 prefetch pair, the non-PARTIAL (prod) dispatch, and the PARTIAL (fast/proxy)
    split-K dispatch. impl.py carries only the h33 defect-a assert. The three h33 defect
    fixes ride under the arm and are measured out: the A/B base is the h33-patched code.
  deviation_from_plan: >
    (1) PREDICTION REVISED PRE-BUILD. The plan's own PRIMARY falsifier (P77, pass bar >= 5%)
    returned 1.83% raw / ~0 clock-normalised, refuting `>= 1.030` before a line was built.
    1.83% was neither the plan's pass nor its kill (0.32% floor) and the plan gave no rule
    for the middle, so building anyway was recorded as a DECISION with grounds and the
    prediction revised to `<= 1.018` BEFORE measuring. The bound held; the central estimate
    ("inside the floor") was wrong in sign -- it is a clear loss.
    (2) LOOP ORDER INVERTED. Under a descending scan the masked pairs are the LOWEST, so
    qloop_mask runs after qloop_full and the r9.i1.g25 two-pair prologue moved from between
    the loops to ahead of both. Flagged at Step 0. qloop_mask carries no prefetch
    (carry=False), so no handoff needed re-plumbing.
    (3) PARTIAL's split-K chunks are mirrored from the top (_qt0 = nqt2-1-_off) rather than
    walked up from qp_start+nmaskp. Same partition of the same pairs, opposite direction.
    (4) The `also_expect` ISA-neutrality rows were NOT met (see prediction_check.also_expect).
    The candidate's central structural claim -- that this arm "does not test pool rule 1 at
    all" -- is FALSE AS BUILT: the last prefetch load moved 189 -> 192 by register-allocator
    accident, and pool rule 1 holds for an eighth time.
    (5) k_dkdv's ISA VGPR count is 904 in BOTH arms (descriptor column 456 x 2 = 912),
    not the campaign's 740. Occupancy conclusion (1 wave/SIMD) unaffected.
  build_failures: []
  build_note: >
    No build failures. First compile, first UT pass, first validation pass. The absence is
    itself the entry: this change adds no memory-space op, no intrinsic and no layout -- it
    is index arithmetic on a loop that already existed, which is exactly what Step 0
    concluded.

