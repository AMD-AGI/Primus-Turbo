for_facts_md:
  - >
    A pure index-direction change is NOT ISA-neutral in this backend. Mirroring an induction
    variable with net-zero arithmetic (s_add_co_i32 -1 / s_sub_co_i32 +1), adding no memory
    operations, still moved the register allocator by 102 bank-switch prefixes, the hot body
    by 19 instructions, and DYNAMIC INSTRUCTION FETCH by 15.22%. Any future candidate whose
    argument is "this is just a reindex, the code is the same" is making a claim this round
    measured to be false. SQC_ICACHE_REQ is the one-PMC-pass gate that catches it.
  - >
    Pool rule 1 survives an eighth test, and survived it BY ACCIDENT. g77 was selected partly
    because it was believed to sit off that axis; it landed on it anyway, via the register
    allocator rather than via the source.
  - >
    P77 (address-pin probe) is the first direct evidence on this host that memory traffic and
    core clock are COUPLED: the pinned arm ran 3.2% faster in raw time while clocking 3.2%
    higher, netting ~0. This strengthens the reviewer's side of the unresolved r25.i0.C2
    disagreement.
