    impl.py: 08cb8533d75e82198fabb9514fd18ba5      # byte-identical to op/current
    _env.py: 7f33871b977f16ae03b95dd89a44483e      # byte-identical to op/current
    __init__.py: 0024d09db2284ac48c29ab70e11a821d  # byte-identical to op/current
  correctness: pass
  determinism: pass
  speed: FAIL
