implementation:
  files_changed: [rounds/031/op/kernels.py]
  # impl.py, _env.py, __init__.py byte-identical to job_context/op/current.
  static_gate:                      # h3/h18, free, a GATE on the build and not a prediction
    k_dqg_0_armA:
      hot_loop_instructions: {base: 1311, g91: 1240}
      v_pk_mul_f32: {base: 256, g91: 192}          # exactly the predicted -64
      masked_loop_instructions: {base: 827, g91: 790}
      s_set_vgpr_msb: {base: 280, g91: 275}
      vgpr_count_isa: {base: 991, g91: 993}        # ⚠ 31 from the 1024 wall
      vgpr_spill_count: {base: 0, g91: 0}          # h3 kill-gate PASS
      scratch_ops: {base: 0, g91: 0}               # h3 kill-gate PASS
      k_dkdv_0: "byte-identical across both arms -- g91 is provably confined"
    k_dkdv_0_armB:
      hot_loop_instructions: {base: 660, g92: 631}
      v_pk_mul_f32_removed: 16                     # ⚠ only 16 of the predicted 32; LLVM had CSE'd the rest
      masked_loop_instructions: {base: 653, g92: 688}   # ⚠ went the WRONG WAY
      s_set_vgpr_msb_masked: {base: 105, g92: 142}
      vgpr_count_isa: {base: 729, g92: 742}
      vgpr_spill_count: {base: 0, g92: 0}
      k_dqg_0: "byte-identical -- g92 is provably confined"
  build_failures:
    - attempt: 1
      error: "detached python3 became <defunct> instantly; no output file was ever created"
      root_cause: >-
        Container fa-g3's ONLY bind mount is /home/lihuzhan -> /home/lihuzhan, so its /tmp is
        private to the container. The scratch tree built on the HOST under
        /tmp/op-evolve-...-r031 did not exist inside the container, and the arm path resolved
        to nothing. Fixed by relocating scratch under the shared mount
        (rounds/031/1-opt/scratch/) and leaving a host-side symlink at the named /tmp path.
        MECHANISM WORTH KEEPING: on this runner, anything an in-container process must read
        has to live under /home/lihuzhan, and a path that exists on the host proves nothing.
    - attempt: 2
      error: "armAB was silently never dumped; its ISA directory stayed empty with no error"
      root_cause: >-
        `sed -i 's|^dump armA.*||'` also matches `dump armAB` -- the pattern is a prefix, not
        a word. Fixed by rewriting isa.sh to take arm names as \"$@\" arguments. A silent
        no-op, not a failure: nothing in the output said the arm had been skipped.
  deviation_from_plan: >-
    ONE, and it was forced by my own free instrument BEFORE any card time was spent. Both
    arms were designed around "fma lowers to unpacked v_fma_f32". The VF_Q compile
    (r31.i0.C2) showed v_pk_fma_f32, packed, so both arms were NARROWED to exponent-only
    hoists: the scale-at-store half was dropped and both epilogues left byte-identical. This
    is a narrowing of the same mechanism, not a switch to a different one -- the different
    mechanism (moving scale onto the dQ accumulator at the store) is filed as pool rule 6
    for a later round with a one-compile instrument attached, exactly because switching
    mechanism mid-round is how a result stops meaning anything.
  latent_bug_found_not_fixed: >-
    VF_KV = True in op/current is incorrect: it drops the trailing * scale from ds_l on the
    claim that the scale is applied at the dK store, and NEITHER k_dkdv epilogue branch has
    any VF_KV-guarded scale. It is dead code (the flag is False), it is not mine, and this
    round touched nothing adjacent to it -- so it is REPORTED and left exactly where it is.

expected: >-
  g91: folding scale into the exp2 exponent removes 64 v_pk_mul_f32 from k_dqg's hot loop.
  Calibrated on the only paired data this loop has (u2n: -86 instructions -> +2.48% prod),
  that is ~+2.0% prod, band +0.8% to +2.5%.
  g92: the same edit on k_dkdv removes ~24 of 660 weighted instructions; at a 0.15x
  conversion and a 61.1% kernel share that is ~+0.33% prod against a 0.32% floor -- a
  PREDICTED NULL, scheduled anyway because paired with g91 it is the cheapest test this
  campaign has of whether the two conversion factors predict anything at all.
  The merge: additive, ~+2.3% prod, because the two arms touch disjoint kernels and disjoint
  expressions.
