  exit_code: 2                      # correctness pass, determinism pass, speed FAIL
  run_against: rounds/031/op        # passed explicitly; the default would grade op/current
  runs_this_session: 1              # through the fa-g3 runner, detached with a sentinel
  tree_md5:
