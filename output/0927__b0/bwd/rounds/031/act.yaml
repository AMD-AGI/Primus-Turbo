outcome: delivered
# Built, measured, REFUTED, and left in the working copy. `delivered` is not a claim that
# it won -- it is the statement that code was built, measured and shipped. The acceptance
# arithmetic below does not promote it, and that is the correct outcome for this arm.

correctness:
  unit_tests: pass                # ut/test_correctness.py --impl rounds/031/op -> 15/15, UT_RC 0
  precision: pass
  checked_with: op/validation.py  # the job's own gate; nothing self-written
  sqnr_db: 52.52                  # worst tensor on any shape (dq @ proxy); gate is 50.0
