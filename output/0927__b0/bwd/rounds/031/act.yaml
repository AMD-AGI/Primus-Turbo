      1.55% masked-trip weight) and the card returned ten times that, with the wrong sign.
  - id: r31.i1.g91+r31.i2.g92
    built: "the merge, measured always as a fifth arm because that was the route's condition"
    tflops: {prod_b4_s8192_hq32_hkv8_d128: 630.32, proxy_b1_s4096_hq32_hkv8_d128: 573.11,
             fast_b1_s1024_hq8_hkv2_d128: 96.90}
    vs_champion: 0.9601
    shipped: false
    note: >-
      Not shipped because g92 lost -- the rule is "shippable only if NEITHER arm lost", and
      it binds regardless of how the merge reads. Additive with its parts at prod to 0.017
      points (-3.892% measured vs -3.909% summed) but SUPER-ADDITIVE at proxy (-4.018%
      measured vs -5.527% summed). Recorded as a discrepancy, NOT banked: two edits in two
      independent kernels cannot help each other, so a super-additive reading means the
      ruler moved, not the code.

instruments:
  - id: r31.i0.C2
    title: "Compile-only ISA histogram of VF_Q=True: what does fx.fma actually lower to?"
    ran: true
    cost: "one compile, zero card time"
    predicted: "fx.fma lowers to an unpacked v_fma_f32, breaking pk pairing"
    measured: >-
      REFUTED. fx.fma lowers to v_pk_fma_f32, PACKED. The arm h73 records at +2.0% (a LOSS)
      has 1311 -> 1100 instructions in k_dqg .LBB0_4, s_set_vgpr_msb 280 -> 248, one fewer
      VGPR, and no unpacked arithmetic anywhere.
    held: false
    reading: >-
      On k_dqg's hot loop, INSTRUCTION COUNT DOES NOT PREDICT TIME -- it pointed the wrong
      way by 211 instructions. This is h18's rule arriving as a measurement rather than as
      advice, and it is the fourth time in this job that every static metric improved and
      the card disagreed. It paid for itself before the round spent a second on the card:
      both arms were narrowed to exponent-only hoists, the scale-at-store half was dropped,
      and both epilogues were left byte-identical.

prediction_check:
  metric: prod_vs_champion_pct
  predicted: {g91: "+2.0 central, band +0.8 .. +2.5", g92: "+0.33, a predicted null against a 0.32% floor"}
  measured: {g91: -0.61, g92: -3.38}
  held: false
  reading: >-
    THE FINDING IS NOT "two arms lost 0.6% and 3.4%". It is that h16's two-regime
    issue-to-time model is ANTI-PREDICTIVE on this op. The model says k_dqg (0.61x) should
    move ~4x more than k_dkdv (0.15x) for the same edit; the identical edit moved k_dkdv
    5.5x MORE, and both moved backwards. Sign and magnitude both fail, on the cheapest
    paired test the campaign could have run.
    UNMEASURED HYPOTHESIS, filed and not asserted: the softmax chain's ordinary VALU may not
    be on the critical path at 1 wave/SIMD, so removing it removed scheduler slack rather
    than work. The number that would settle it is the gfx1250 transcendental rate -- the
    corpus has gfx950's (v_exp_f32 half-rate, cost 2.00) and NOTHING for this part -- and it
    is one instrument away.

