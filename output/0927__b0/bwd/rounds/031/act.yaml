    The arm is an arithmetic reassociation and so is NOT bitwise against the incumbent,
    yet 52.52-52.83 dB is indistinguishable from the incumbent's own 52.52. The
    reassociation costs no measurable precision. It costs time.

measurements:
  benchmark: op/benchmark.py
  same_session_references: [rounds/029/op, rounds/030/op, job_context/op/beat]
  # TWO interleaved sweeps, both this session, both on the idle fa-g3 card.
  #   raw/bench/   -- beat + base(=op/current=r029) + g91 + g92 + merge, five arms, one
  #                   process per shape, two passes. This is where the arm comparison lives.
  #   raw/bench2/  -- beat + r029 + r030 + r031(ship), four arms, same construction. Added
  #                   because sweep 1 did NOT contain r030, and step 6 asks for every
  #                   distinct per-shape champion re-run rather than read from a file.
  # The figures below are sweep 2's -- the one that contains every champion.
  # ⚠ beat is taken from the SAME sweep as the arms it is compared against: proxy beat read
  #   748.06/748.75 in sweep 1 and 729.12/750.52 in sweep 2, a 2.9% spread, so carrying a
  #   beat figure between sweeps would have been a 2.9% error with nothing to show for it.
  # ⚠ Rounds before 28 deliberately NOT measured: different architecture, replaced by the
  #   round-28 refactor. Best-ever means best on the CURRENT structure.
  shapes:
    - name: prod_b4_s8192_hq32_hkv8_d128
      this_round_tflops: 653.08
      best_round_tflops: 657.12
      beat_tflops: 818.55
      target_tflops: 818.55
      champion_round: 29
      champion_tflops: 657.12       # re-measured NOW, in the same process as this round's arm
      champion_rebuilt: true
      ratio: 0.7979
      vs_champion: 0.9939           # -0.61%  =  8.370721 -> 8.425383 ms
    - name: proxy_b1_s4096_hq32_hkv8_d128
      this_round_tflops: 588.40
      best_round_tflops: 603.38
      beat_tflops: 739.82
      target_tflops: 739.82
      champion_round: 29
      champion_tflops: 603.38
      champion_rebuilt: true
      ratio: 0.7953
      vs_champion: 0.9752           # -2.48%
    - name: fast_b1_s1024_hq8_hkv2_d128
      this_round_tflops: 98.66
      best_round_tflops: 98.13
      beat_tflops: 57.27
      target_tflops: 57.27
      champion_round: 29            # ⚠ NOT 30. Round 30 took the fast champion on a stored
                                    # 100.37 vs r028's 99.37. Re-measured beside r029 today,
                                    # r030 reads 96.41 against 98.13 -- the OPPOSITE sign.
                                    # Round 30's own act.yaml warned the fast channel scatters
                                    # over 0.8-2.8 points and that its figure was an A/A null;
                                    # this is that warning coming true, and it is exactly why
                                    # champions are re-run rather than read.
      champion_tflops: 98.13
      champion_rebuilt: true
      ratio: 1.0                    # 98.66/57.27 = 1.7227, capped
      vs_champion: 1.0053
      # ⚠ A/A NULL, and claimed as nothing. use_g is False at fast, so k_dqg -- the only
      # kernel g91 touches -- is NEVER DISPATCHED. +0.5% here is scatter, not an effect.
  score: 0.8644                     # mean(0.7979, 0.7953, 1.0)
  regressions:
    - {shape: prod_b4_s8192_hq32_hkv8_d128, vs_champion: 0.9939, within_band: true,
       note: "real, reproducible, above the 95% floor"}
    - {shape: proxy_b1_s4096_hq32_hkv8_d128, vs_champion: 0.9752, within_band: true,
       note: "above the 95% floor; proxy scatters wider than prod in both sweeps"}
  acceptance_self_read: >-
    NOT accepted, and the reason is condition one. Throughput did not improve on the best
    ever re-measured beside it: prod 653.08 against 657.12, proxy 588.40 against 603.38.
    The other two conditions hold -- every below-target shape is above its own 95% floor
    (0.9939, 0.9752), and fast, the one shape that had reached its target, stays above it
    at 1.7227x beat. Reported as measured; Python decides, not this file.

