explored:
  ran:
    - "free opcode census of round 30's existing ISA dump (k_dqg .LBB0_4, k_dkdv .LBB0_11) -- no card time"
    - "compile-only ISA histogram of VF_Q=True (r31.i0.C2) -- no card time"
    - "static ISA gate on both arms and the merge before any timing (h3/h18)"
    - "two interleaved benchmark sweeps, five arms then four, two passes each"
  # What each changed: the census picked the target (softmax VALU is 44% of k_dqg's hot
  # loop, and the source chain predicts 256/128/128/64 exactly). The compile-only histogram
  # REFUTED my own fma hypothesis and narrowed both arms before they cost a second of card
  # time. The static gate confirmed confinement. Sweep 2 overturned round 30's stored fast
  # champion.
  consulted:
    - knowledge/backends/flydsl/attention/dead-ends.md
    - knowledge/backends/flydsl/attention/README.md
    - knowledge/backends/flydsl/README.md
    - knowledge/arch/gfx1250/isa.md
    - knowledge/arch/gfx1250/perf.md
    - knowledge/ops/attention/README.md
    - knowledge/ops/attention/backward.md
    - knowledge/backends/aiter/attention/        # the beat backend's own notes -- same op, other backend
    - knowledge/backends/triton/attention/       # same op, third backend
  bound: latency
  confidence: high
  why: >-
    1 wave/SIMD pinned by VGPR (736/992 ISA), no spill anywhere, bandwidth ~40x below any
    plausible roof, clock 1753-1790 MHz under load and refuted as power-limited by round 30
    at <=0.821x of a 2500 W cap. This round adds the sharpest evidence yet: removing 64
    v_pk_mul_f32 from a hot loop made it SLOWER, which is what a latency-bound loop with
    scheduler slack does and what a compute-bound one cannot do.

