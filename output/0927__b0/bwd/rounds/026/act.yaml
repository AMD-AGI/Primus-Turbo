  files_changed: [op/impl.py, op/kernels.py]     # relative to rounds/019/op, the new base
  base_tree_changed: true                        # op/current (r20) -> rounds/019/op + h33
  build_failures:
    - {attempt: 1, error: "validation.py: FAILED: no such implementation directory /tmp/.../armA",
       root_cause: "the container mounts only /home/lihuzhan; the host /tmp is invisible inside
                    fa-g3. Arm trees moved under rounds/026/1-opt/arms/ and re-run with a FRESH
                    key (r26_valA2) -- a finished run is not a cache, so no key was reused."}
    - {attempt: 2, error: "rocprofv3 RC 1, no artefacts on the host",
       root_cause: "two causes at once: --stats ALONE is fatal on rocprofv3 1.3.2 ('No tracing
                    options were enabled for --stats option'), it needs --kernel-trace; and
                    -d /tmp/... wrote into the container's own /tmp."}
    - {attempt: 3, error: "rc 127, bash: raw/stats.sh: No such file or directory",
       root_cause: "the runner's cwd inside the container is not the caller's; the script
                    needs an absolute path."}
    - {attempt: 4, error: "RC 2, benchmark.py: arm 'cand': no impl.py under op/cand",
       root_cause: "--arm-path cand=DIR already registers the arm; passing --arms cand as well
                    makes the parser resolve 'cand' a second time as a name relative to op/."}
    - {attempt: 5, error: "rocprofv3: corrupted double-linked list, process hung, no CSV",
       root_cause: "host-side heap corruption inside rocprofv3 1.3.2's OWN output generation,
                    after the kernels had already run and printed a correct RESULT. Not a GPU
                    fault -- dmesg clean, GPU 3 at 0% afterwards. Killed explicitly (rc 137
                    written by hand; the sentinel never appeared). h4 reconfirmed: the survey
                    is unavailable on this op and no flag or path recovers it."}
    - {attempt: 6, error: "r26_isa1 exited rc 0, all three compiles reported RC 0, and produced
                           NO dumps at all -- only a log per tree",
       root_cause: "FlyDSL's DebugEnvManager carries env_prefix=DEBUG but overrides the two dump
                    options with EXPLICIT env_var names, FLYDSL_DUMP_IR and FLYDSL_DUMP_DIR
                    (flydsl/utils/env.py:241,243). I passed the prefix-derived
                    FLYDSL_DEBUG_DUMP_IR / FLYDSL_DEBUG_DUMP_DIR, which the manager silently
                    ignores. MECHANISM: a successful-looking run that produced nothing, because
                    for these two fields the option name is not derived from the prefix. Fixed
                    and re-run under a FRESH key r26_isa2 (rc 0, three 21_final_isa.s). This is
                    the round's only driver failure; NO arm failed to compile -- armC compiled
                    on the first attempt."}

