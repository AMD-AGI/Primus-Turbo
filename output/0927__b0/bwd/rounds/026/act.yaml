       fast: 89.25, proxy: 583.34, prod: 635.28, beat_prod: 838.55}
    - {key: r26_val_final, path: rounds/026/op, geomean: 0.988,
       fast: 89.70, proxy: 584.52, prod: 628.63, beat_prod: 837.82}
  # DISCREPANCY, recorded and NOT resolved in this round's favour.
  # rounds/026/op and rounds/026/1-opt/arms/armA are byte-identical (diff -rq clean), and the
  # tree was re-verified against r19 and op/current. The two validation runs of that identical
  # code read prod 635.28 and 628.63 TF/s -- a 1.06% spread -- while the five-arm interleaved
  # benchmark read 638.567 / 638.508 for the same code, a 0.009% spread. beat was stable across
  # all of them (838.55 / 837.82) and sclk was the same band (1765-1812).
  # Reading: validation.py times ONE arm against beat per shape, in separate processes per
  # shape, so it does not share a clock excursion the way an interleaved five-arm process does.
