    tflops: {}
    vs_champion: null
    shipped: false
  - id: "aiter b4 / techniques.md 16 (MFMA shape per GEMM)"
    built: "NOT built -- died at a free gate, ZERO card time"
    tflops: {}
    vs_champion: null
    shipped: false
    note: "gfx1250 emits only wmma_f32_16x16x16_bf16 and wmma_f32_16x16x32_bf16 for
           bf16-in/fp32-out. One output tile shape, so there is nothing to choose between;
           the only remaining axis (K 32->16) ADDS dependence. Closed for this part."

