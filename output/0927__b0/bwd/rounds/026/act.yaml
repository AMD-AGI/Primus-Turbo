      k_delta_bshd_0: "byte-identical"
      k_dkdv_0: "2968 -> 2973: +2 s_add_co_i32, +2 s_min_i32, +1 s_max_i32. Nothing else moves.
                 The other 405 textual diff lines are SGPR renumbering, i.e. allocation noise."
      hot_loop: "qloop_full 674 -> 675 insns (ONE of the five). qloop_mask 620 -> 620."
      vgpr_count: "724 -> 724"
      first_body_load_index: "81 -> 82"
      last_body_load_index: "115 -> 116"
    falsified_mechanisms:
      - {predicted: "address math collapses, insn count FALLS", measured: "+5", verdict: falsified}
      - {predicted: "compiler hoists prefetch address: first load EARLIER, last unmoved",
         measured: "first 81->82, last 115->116, both one LATER", verdict: falsified}
      - {predicted: "VGPR falls", measured: "724 -> 724", verdict: falsified}
    note: "By this row's own written condition the +0.672% prod is RECLASSIFIED as an unexplained
           floor violation and nothing may be built on it until it is re-measured. One scalar
           s_min_i32 per iteration, against a 675-instruction body on a latency-bound kernel
           whose scalar unit is not the bottleneck, cannot pay +0.672%.
           Step 6 then re-measured the gap six arms deep in one process on a less-throttled card:
           cand over rounds/019/op is +0.29%/+0.43% fast, +0.57%/+0.34% proxy, +0.21%/+0.14% prod
           (p1/p2). Still positive in sign at every shape in both passes, but roughly a third of
           the original figure and now at the cross-arm floor.
           STANDING CONSEQUENCE: the h33 clamps are a CORRECTNESS fix costing one SALU per
           iteration, not a speed lever. Round 24 priced them free on the r20 tree and round 24
           was right; round 26's +0.672% was the artefact.
           k_dq_0 being byte-identical is its own finding: h33 defect b rewrote g_dq's extent in
           Int64 and at the compiled shape that rewrite costs NOTHING in emitted code."
