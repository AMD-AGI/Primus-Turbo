  - id: r26.i1.g82
    built: "NOT built -- ROUTE ROW 15, abandoned at its own free gate (c). ZERO card time.
            Source kept at rounds/026/1-opt/arms/armC/ (21-line kernels.py diff, impl.py
            untouched); its qloop_full body and prologue are textually identical to
            rounds/024/op's apart from comments, so the lift is the established g62+h33 form."
    tflops: {}
    vs_champion: null
    shipped: false
    gate:
      vgpr_spill_count: {bar: 0, base: 0, arm: 0, verdict: pass}
      scratch:          {bar: 0, base: 0, arm: 0, verdict: pass}
      vgpr_count:       {bar: "<=960 and >=1 wave/SIMD", base: 724, arm: 904, verdict: pass}
      lds_bytes:        {bar: unchanged, base: 70656, arm: 70656, verdict: pass}
      wmma_per_body:    {bar: 64, base: 64, arm: 64, verdict: pass}
      qloop_mask_body:  {bar: unchanged, base: 620, arm: 620, verdict: pass}
      last_prefetch_load_index_qloop_full: {bar: "not later", base: 116, arm: 187, verdict: KILL}
      qloop_full_body_insns: {base: 675, arm: 750}
    note: "Pool rule 1 -- anything that moves the last prefetch load's issue index later loses --
           is now 9 for 9, and this is its FIRST confirmation on B0, so it is no longer a rule
           fitted only to A0. Mechanism from the opcode histogram: +32 buffer_load_b128,
           +64 v_mov_b64, +42 s_set_vgpr_msb, +6 s_clause, -12 s_wait_loadcnt. The second stage
           does buy cover (twelve fewer waits) and pays for it by moving the whole load block
           71 instructions later.
           STILL UNKNOWN and not claimed otherwise: g62's SIGN on the g59 tree. The gate did not
           measure it. A different mechanism for deeper cover that does NOT lengthen the load
           block is a new candidate for a later round, not a quiet substitution inside this one.
           SECOND-ORDER FACT, worth more than the entry: k_dkdv on the g59 base runs at 724 VGPR,
           not 904. facts.md:381's 904 is a g61+g62 figure and does not describe B0."
  - id: r26.i2.g83
    built: "NOT built -- ROUTE ROW 16, abandoned at STEP 1 (the free compile-only ISA diff).
            Step 2 not run. ZERO card time."
    tflops: {}
    vs_champion: null
    shipped: false
