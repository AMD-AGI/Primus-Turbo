explored:
  ran:
    - "SIX-arm two-pass acceptance A/B (cand, rounds/017/op, rounds/019/op, rounds/020/op,
       rounds/025/op, beat) x 3 shapes, all arms of a shape interleaved in ONE process.
       Key r26_benchfinal. This is the round's scoring measurement."
    - "OFFLINE ISA GATE, key r26_isa2, ZERO card time beyond three compiles: FLYDSL_DUMP_IR
       dumps of rounds/026/op, arms/armC (=g82) and rounds/019/op at prod shape. It decided
       BOTH route idea rows -- g82 killed on pool rule 1, g83 killed on an empty mechanism."
    - "five-arm two-pass A/B (A, B, rounds/020/op, rounds/019/op, beat) x 3 shapes, interleaved"
    - "validation.py on arms/armA (key r26_valA2) and on rounds/026/op (key r26_val_final)"
    - "P76 -- subtractive k_dq ceiling: op/current vs op/current-minus-k_dq's-S+dP GEMMs and
       exp2/dS VALU chain, 51 iters, one process, key r26_p76. THE deciding number for g76."
    - "G1a' -- g76's dS layout gate, read from source, zero card time"
    - "WMMA-shape gate -- enumerated fx.rocdl's bf16 WMMA forms on gfx1250, zero card time"
    - "rocprofv3 --stats --kernel-trace on armA at prod (key r26_stats4): the benchmark ran and
       printed a real RESULT, then rocprofv3 1.3.2 died with `corrupted double-linked list`
       inside its own output generation and hung. No CSV. h4 reconfirmed; NOT a GPU fault."
  consulted:
    - knowledge/optimization/routes/1-metrics-to-techniques.md
    - knowledge/backends/flydsl/attention/techniques.md
    - knowledge/backends/flydsl/attention/recipes/hd128.md
    - knowledge/backends/flydsl/attention/README.md
    - knowledge/backends/flydsl/attention/dead-ends.md
    - knowledge/backends/aiter/attention/recipes/fmha_v3_bwd_hd128_bf16.md
    - knowledge/backends/hipkittens/attention/recipes/gqa_d128.md
  bound: latency
  confidence: high
  why: >
    Unchanged and reinforced. Arm B landed its mechanism exactly -- g61 splits the S/P
    dependent WMMA chain, which is the textbook fix for a dependence-bound body -- and lost
    0.885% prod at 9x the floor on the g59 tree, while the same edit was measured NULL on the
    tree without g59. A change's sign here is a property of the tree it lands in, not of the
    mechanism. And P76 now prices the whole recompute at 22.36% while the memory route to
    removing it costs the same 22.36%, which is the corpus's item-14 trade measured on this
    part: marginal WMMA at one wave per SIMD is nearly free, so the redundant GEMMs are not
    the defect they look like.

