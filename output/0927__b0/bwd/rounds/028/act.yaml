expected: >
  This job runs BLOCK_KV = 32. At prod the kv-outer grid is nhkv(8) x nblk(256) x nb(4) =
  8192 workgroups onto ~1024 slots = EIGHT dispatch waves, and impl.py's own census comment
  already says the greedy hardware dispatcher balances the 256:1 causal work skew to a
  modelled 100%. Greedy list scheduling over eight waves is a load balancer; pairing is a
  second one. You cannot collect the same imbalance twice. So: predicted prod cand/armA =
  1.000 to 1.005. The residue pairing can still collect is tail-wave quantisation plus the
  1/n block granularity = 1/256 = 0.39% at prod, NOT the corpus's 1/16 = 6.25%.
  Downside risk priced too: the ISA gate shows VGPR 729 -> 735 and the masked q loop growing
  650 -> 656/660, plus a doubled text section costing instruction cache. If prod comes back
  BELOW 1.000 that is the mechanism I will name.
  proxy and fast are predicted at exactly 1.000x: g88 is on the nsp == 1 branch only, so
  there it is a derivational A/A null and any deviation is the session floor.
  # Verbatim from raw/expected_g88.txt, written after the build and the free gate and BEFORE
  # the benchmark produced a number; the file's mtime (07:23:49) is the evidence.
  # OUTCOME: wrong. prod measured 0.9947 -- the downside clause, not the central estimate.

