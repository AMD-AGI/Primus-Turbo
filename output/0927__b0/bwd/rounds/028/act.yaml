explored:
  ran:
    - "static ISA gate on 21_final_isa.s for k_dkdv_pair vs k_dkdv (raw/isa2.sh, raw/gate.py) -- decided that the edit had not leaked into the hot body, which is what made the arm worth card time"
    - "four-reading free gate as h18 requires: qloop_full body length, its s_set_vgpr_msb count, VGPR/spill/scratch/LDS, and the last buffer_load_b128 index (pool rule 1)"
    - "two built-in derivational A/A nulls (proxy, fast) inside the same process and clock excursion -- gave the session floor at zero extra card time"
    - "device-mapping check via docker inspect after a neighbour job appeared mid-run -- changed nothing about the numbers but is the reason I can say so"
  consulted:
    - backends/aiter/attention/recipes/fmha_v3_bwd_hd128_bf16.md
    - backends/flydsl/attention/techniques.md
    - backends/flydsl/attention/dead-ends.md
    - optimization/techniques/1-grid-and-cache-locality.md
    - optimization/techniques/5-autotune-and-sweeps.md
    - arch/gfx1250/isa.md
  bound: latency
  confidence: medium
  why: >
    Round 28 eliminated the two remaining non-latency explanations for prod. g87 showed the
    split-K axis is converged with an INTERIOR optimum (nsp 1/2/4/8 = 0.8162/1.0000/0.9382/
    0.8485), so prod is not split-K limited. g88 showed prod is not dispatch-limited: its kv
    grid is eight dispatch waves deep and greedy dispatch already balances the 256:1 causal
    skew, so a second balancer collected nothing and cost 0.53%. And g86 showed a verified
    -2.4% cut in ISSUED instructions returns +0.28-0.37%, a ~0.15x conversion, so the hot
    body is not issue-limited at the margin either. What is left is dependent latency inside
    the hot body. Confidence stays medium because all three are eliminations, not a direct
    measurement of latency -- and h4 forbids rocprofv3 and PC sampling on this op, so a
    direct measurement is not available to this job.

