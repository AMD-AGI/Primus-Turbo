# NOTE on `candidate`, because the honest answer is not a round-29 g-id.
# The tree shipped in rounds/029/op is the MERGE of two ids that BOTH already existed:
#   h70          -- an operator HINT (route row 11), built here as lab arm u2n. Hints are
#                   not pool ids, so it cannot be named in this field.
#   r27.i3.g86   -- an INHERITED pool id, built and rejected with its round twice before,
#                   rebuilt and SHIPPED here. Inherited candidates keep their original id.
# `candidate` therefore names r27.i3.g86: it is a real pool id that this round executed and
# left in the working copy. The round's larger share of the gain came from h70.
# It would be WRONG to name r29.i1.g89 or r29.i2.g90 here -- both were FILED this round and
# NOT BUILT, which is what route.md's outcome column for rows 17-18 says. Naming one would
# make act.yaml contradict the route table and overstate the round.
# `arms:` below is the complete account of what was built.

