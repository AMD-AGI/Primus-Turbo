  - id: u2nb
    built: "throwaway probe, no g allocated -- u2n + sched_barrier(0) between the halves"
    tflops: {prod: 608.8, proxy: 551.8, fast: 98.4}
    vs_champion: 0.9545
    shipped: false
    note: >-
      Clear LOSS, and it closes the k_dq lab's unrun plan.sh item 1. VGPR fell 991 -> 798 and
      it still lost 4.55% prod / 6.68% proxy: both counts sit on the same 1-wave/SIMD rung, so
      the registers bought no occupancy, while the barrier pushed the first prefetch group
      from index 5 to 532 and collapsed its cover.

expected: >-
  The lab measured u2n at prod op -3.06% on time (3 rotated processes) with output bitwise
  equal to r19h, and r27.i3.g86 at +0.35%/+0.37% on prod. Adopting u2n verbatim should
  reproduce roughly +3% of throughput, and the merge with g86 should land near +3.5% if the
  two are additive -- they touch disjoint kernels (k_dq/impl.py vs k_dkdv's epilogue), so
  additivity is the expectation rather than a hope. I do not expect this to pass h69: ~3%
  cannot close a ~22% gap to beat.

added_to_pool: [r29.i1.g89, r29.i2.g90]
route_updated: true

implementation:
  files_changed: [op/kernels.py, op/impl.py]
  build_failures:
    - attempt: 1
      error: "patch -p0 < g86.patch -> 'Hunk #1 FAILED at 572', rejects to kernels.py.rej"
      root_cause: >-
        The lab's u2n kernels.py carries inert lab switch code in k_dkdv's epilogue
        (okv = [ok_[si] * scale ...] if VF_KV else [...]), so the g86 patch context did not
        match. Fixed by splicing on the anchor line 'base_o = bat * Skv' instead of
        hand-editing; VF_KV is False so semantics are unchanged, and armAB's per-kernel ISA
        counters were then verified identical to armA's k_dqg and armB's k_dkdv.
    - attempt: 2
      error: "detached launch produced no sentinel; docker exec returned 1, no out file"
      root_cause: >-
        Two independent faults. (1) '&' bound the whole '&&' list, so bash -c exited before
        mkdir ran. (2) The sentinel path /host/artifacts/... exists INSIDE the container but
        is not the bind mount -- the only mount is /home/lihuzhan -> /home/lihuzhan, so host
        and container were writing to different directories. Confirmed via pgrep that nothing
        was orphaned before relaunching, and deleted the /host decoy my own mkdir created.
