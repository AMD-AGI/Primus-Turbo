explored:
  ran: []
  # No rocprofv3: h4 forbids it on this op. The survey was the free static-ISA dump of every
  # arm (raw/isa.sh -> per-kernel VGPR / spill / scratch / body-instruction / opcode census).
  # It changed two decisions and is why it was worth its minutes: the k_dqg opcode census
  # (256 buffer_store_b16, 649 s_set_vgpr_msb) produced BOTH pool entries, and the
  # basic-block census of v_mov_b64 KILLED a third candidate before it was built.
  consulted:
    - backends/hipkittens/attention/recipes/gqa_d128.md
    - backends/flydsl/attention/dead-ends.md
    - backends/flydsl/attention/techniques.md
    - optimization/techniques/3-pipelining-and-scheduling.md
    - optimization/routes/0-kernel-programming-principles.md
  bound: latency
  confidence: medium
  why: >-
    Split verdict, and the split is the round's finding. k_dkdv remains latency-bound at the
    margin (round 27: a 2.4% instruction cut returned 0.35%, a ~0.15x conversion) and that
    verdict is untouched. k_dq is ISSUE-bound: removing 65 back-edge v_mov_b64 rotation
    copies (741 -> 655 instr/kv-block) returned +3.07% prod and +2.77% proxy against the
    incumbent, far above 0.15x. Confidence is medium because the whole-op figure is still
    dominated by k_dkdv, which no round has yet moved.

