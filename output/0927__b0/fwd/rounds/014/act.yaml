implementation:
  files_changed: [op/flydsl_fwd/fmha_fwd_prefill_a16w16_m32x8.py]
  build_failures:
    - attempt: 1
      error: "multicast arm finite but not bitwise equal to op/current on every paired (even grid x) case, toy and full; odd-grid case and the probe arm bitwise equal (raw/pair/attempt1)"
      root_cause: "split issue: WG 0 issued K and WG 1 issued V, each with workgroup_mask=3. TDM multicast is a join (every WG named in the mask issues the identical load and the fetch is merged; a WG that does not issue receives nothing), so each WG saw only its own half of K/V. Fixed by having both WGs issue both with the mask (FlyDSL test_tdm_mcast_add / gemm_bf16_gfx1250 pattern; corpus early_timeout text)"
