# ---------------------------------------------------------------- fast-round only
explored:
  ran:
    - "survey: benchmark.py blocked, fast 3 sessions + beat alone + proxy/prod champ/champ2 -> fast is the largest gap (0.927) and not clock-bound; chose the fast underfill lever"
    - "ISA loop census + beat disassembly (s_set_vgpr_msb): msb is 17% of our prod loop but beat pays the same 1.7-1.8/WMMA -> ruled msb out as a candidate"
    - "probe arms occ2fast / m32x2probe / m32x1probe at fast (3-rotation A/A) -> picked m32x2 (x1.08-1.09) over occ2 (x1.02) and m32x1 (x1.045)"
  consulted:
    - backends/flydsl/attention/README.md
    - backends/flydsl/attention/recipes/hd128.md
    - backends/hipkittens/attention/recipes/gqa_d128.md
    - optimization/routes/1-metrics-to-techniques.md
  bound: latency
  confidence: high
  why: >
    The lever is fast's grid underfill (64 WGs on 256 CUs at BLOCK_M=128). The fast clock is flat at ~2.3 GHz, so it is
    not power-bound. Doubling the grid to 128 WGs gave +9% at identical per-row math (bitwise). Halving again to
    256 x 1-wave lost 4%, so at 128 WGs fill is no longer the only limiter. prod, the job's remaining gap, stays
    power/clock-bound (sclk 993-1257).

