    vs_champion: 0.9923
    shipped: false
    note: "lost proxy x0.9923 (3/3 < 0.995, beyond the A/A floor); prod x1.0035. The corr exp now sits serially on the rescale branch that early tiles always take; proxy has half of prod's kv tiles per row, so more of its tiles pay"
