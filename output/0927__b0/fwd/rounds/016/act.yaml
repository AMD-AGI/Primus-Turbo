    built: "the merge; compiled and correctness-checked only (bitwise = g61 on 52 h16 cases, 49.82 dB min)"
    tflops: {}
    vs_champion: null
    shipped: false
    note: "not measured: B lost beyond the A/A floor, so the merge was not eligible"

expected: >
  g61 cuts prod cycles 1-2% at a flat-to-lower clock, for wall +0.5..1.0% at prod and
  +0.3..0.8% at proxy. g62 removes 2 of 66 trans ops plus ~4 VALU per tile, all off the P chain, for wall
  +0.1..0.4%. That is probably inside the A/A floor. Neither closes the 7% prod gap to beat that r13ns opened.

