work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:l8b_turbo_conv_b2}
workspace: /home/lihuzhan/_dbg_l8b/output

modules:
  pre_trainer:
    framework: torchtitan
    config: pre_trainer.yaml

    # model to run
    model: llama3.1_8B.yaml
    overrides:
      sink_level: null
      file_sink_level: DEBUG
      stderr_sink_level: INFO

      model:
        # 截图里 MI455X 的 FA path 是 Triton flex。
        # 8B_flex 与 8B 参数逐项相同，只多了 attn_type=flex / attn_mask_type=block_causal。
        # 不能用默认的 8B：其 attn_type=sdpa，而 ScaledDotProductAttentionWrapper 的后端顺序是
        # CUDNN -> FLASH -> MATH，前两者在 gfx1250 上不可用，回退 MATH 会物化
        # [4,32,8192,8192] 的注意力矩阵，显存冲到 442GB 后触发 SIGBUS。
        flavor: 8B_flex
        # 本地 tokenizer 资产，避开 gated repo 需要 HF_TOKEN
        hf_assets_path: /home/lihuzhan/_hfassets/llama31_8B
        # converter 打开。它才是真正把 attention 换成 TurboAttention 的东西；
        # use_turbo_attention: true 只替换类，converter 不注册的话那个类永远不会被装上，
        # 也就是说 converters: [] 时测的根本不是 turbo attention。
        #
        # 之前关掉它的理由是 torchtitan 0.2.2 会传 enable_gqa 而 TurboAttention.forward
        # 不接受该参数 -> TypeError。该参数已在 Primus-Turbo 侧接受（并刻意不转发：
        # 我们的 kernel 从 nhead_q/nhead_k 原生处理分组，形状已经带了这个信息）。
        converters: ["primus_turbo"]

      debug:
        seed: 1234

      metrics:
        log_freq: 1
        enable_wandb: false

      lr_scheduler:
        warmup_steps: 10

      training:
        # 复现目标：MBS = GBS = 4, seq = 8192, 1 GPU
        local_batch_size: 2
        global_batch_size: 2
        seq_len: 8192
        mock_data: true
        steps: 10
        gc_freq: 100
        dataloader:
          num_workers: 1
          prefetch_factor: 4
          persistent_workers: true
          pin_memory: true

      # tp1 / pp1 / cp1，单卡不做 FSDP 分片
      parallelism:
        tensor_parallel_degree: 1
        pipeline_parallel_degree: 1
        context_parallel_degree: 1
        data_parallel_shard_degree: 1
        data_parallel_replicate_degree: 1

      # 截图 MI455X 一栏即 compile.enable=False；
      # 且本机 inductor 对 TransformerBlock 做 compile 时的 triton autotune
      # 会触发 hipErrorLaunchFailure 并打死 GPU
      compile:
        enable: false

      # AC = none
      activation_checkpoint:
        mode: "none"
        selective_ac_option: "op"

      # converter 的注册只看 enable_primus_turbo，不看 use_turbo_attention
      primus_turbo:
        enable_primus_turbo: true
        enable_attention_float8: false
        use_turbo_attention: true
