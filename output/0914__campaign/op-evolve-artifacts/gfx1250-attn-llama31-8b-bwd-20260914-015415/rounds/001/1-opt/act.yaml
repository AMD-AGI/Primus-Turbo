implementation:
  files_changed:
    - impl.py
    - vendor/primus_turbo/triton/attention/fused_mha_bwd_kernel.py
    - vendor/primus_turbo/pytorch/kernels/attention/attention_triton_impl.py
  build_failures:
    - attempt: 1
      error: "RuntimeError: Type '...Float8QuantConfig' is already registered as an opaque type"
      root_cause: >
        torch's opaque-type registry is process-global and keyed by qualname, and
        validation.py imports two primus_turbo trees (ours vendored, op/baseline's
        installed) into one process. Fixed by making torch._C._register_opaque_type
        idempotent rather than by unregistering, which would perturb a registry the
        dispatcher reads.
    - attempt: 2
      error: "RuntimeError: an installed primus_turbo was imported before this module"
      root_cause: >
        PRE-EXISTING framework bug, not this round's: op/baseline guards on the name
        primus_turbo being absent from sys.modules, and any candidate that vendors
        the package trips it. An UNMODIFIED copy of op/current reproduces it, so
        before this round validation.py could not judge any directory except
        op/baseline. Fixed by moving the vendored modules to a private
        _op_evolve_<n>. prefix instead of deleting them.
    - attempt: 3
      error: "ValueError: vector::reserve / MemoryError: std::bad_alloc / SIGSEGV (rc 139), intermittently, always at the first fwd() of the speed phase"
      root_cause: >
        Use-after-free in the dispatcher, wearing three faces. The vendored tree and
        the installed primus_turbo both declare
        primus_turbo::attention_triton_forward_impl; two torch.library fragments
        defining one op name share a single OperatorEntry, and when the second
        fragment is collected the schema is destroyed under the first tree's live
        OpOverload. validation.py's speed order is cand>beat>baseline>baseline>beat>cand,
        so baseline registers and dies between the candidate's two turns -- which is
        why it never touched the correctness phase and why whether it fired at all
        depended on when the collector ran. Fixed in one line: register under
        primus_turbo_opevolve::. Cost four validation runs. Two earlier theories
        (sys.modules deletion dropping the last reference; the opaque-type
        unregistration) were both wrong and are recorded as wrong in opt.md.
