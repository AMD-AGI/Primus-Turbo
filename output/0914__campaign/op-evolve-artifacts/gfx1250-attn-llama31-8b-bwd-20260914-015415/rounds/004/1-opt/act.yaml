implementation:
  files_changed: [vendor/primus_turbo/triton/attention/fused_mha_bwd_kernel.py]
  build_failures:
    - attempt: 1
      error: "CompilationError: at 277:8: for phase in (0, 1): AttributeError(\"'Tuple' object has no attribute 'func'\")"
      root_cause: >
        Triton 3.6.0's AST tracer requires the iterable of a `for` to be a CALL node -- it
        reaches straight for `.func` to decide whether it is range, tl.range or
        tl.static_range. Any other expression (tuple, list, zip, a name bound to a sequence)
        raises this AttributeError rather than a diagnostic. There is no Python-level `for`
        in a @triton.jit body; compile-time repetition must go through tl.static_range.
        Fixed by tl.static_range(2) plus replacing the constexpr ternary
        `acc = acc_dv if phase == 0 else acc_dk` with a plain if/else on the same constexpr.
        One failure, one root cause, fixed rather than worked around; the hypothesis is
        unchanged.
