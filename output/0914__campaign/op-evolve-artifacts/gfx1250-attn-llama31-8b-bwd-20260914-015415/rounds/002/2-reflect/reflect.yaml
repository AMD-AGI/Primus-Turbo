round: 2
mode: fast
accepted: false

expectation_check:
  expected: "roughly 2-3% each from r2.i1.g8 and r2.i2.g9, and 4-6% merged if both survived"
  measured: "-7.5% (g8) and -7.0% (g9) against a 0.03-0.06% measurement floor; no merge, both lost"
  held: false
  reading: >
    Wrong in sign and in size. Each arm deleted exactly the instructions it claimed --
    the static census confirms g8 removed the precise 32 v_pk_mul_f32 it targeted --
    and each got slower, because the deletion lengthened live ranges on a kernel
    already at 1024/1024 VGPRs with one wave per SIMD. g8 went 266 -> 307 spills,
    g9 266 -> 325. At this occupancy a source-level deletion is a request to the
    register allocator and the allocator's answer is what gets timed. I modelled the
    instructions and never the allocator, though round 1's num_warps=8 result (2.36x
    slower) had already shown me which term dominates.
    A second expectation failed the same round, for free: step 4's law "time tracks
    vgpr_spill_count and nothing else" was falsified by my own new instrument.
    BLOCK_N1=128 compiles to vgpr_spill_count=0, vgpr_count=771, zero scratch, and
    runs at 11.8-13.3 ms against the incumbent's 8.691. The law holds within a tile
    and is empty across tiles.

