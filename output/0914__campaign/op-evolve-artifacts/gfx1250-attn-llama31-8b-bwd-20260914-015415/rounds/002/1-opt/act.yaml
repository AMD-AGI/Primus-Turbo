implementation:
  files_changed:
    - op/vendor/primus_turbo/triton/attention/fused_mha_bwd_kernel.py
  build_failures:
    - attempt: 1
      error: "rc 139, SIGSEGV, no traceback, at the first attention() call with all three arms' impl dirs loaded"
      root_cause: >
        Three vendored primus_turbo trees in ONE process. impl.py makes the opaque-type
        registration idempotent and round 1 moved the forward to primus_turbo_opevolve::,
        but that namespace is shared by every copy, so the third torch.library fragment
        on the same OperatorEntry takes the process down. validation.py never hits it
        because only one of its three arms carries a vendored tree (beat is
        flex_attention). Fix: one arm per process; arms share a SESSION, back to back
        and palindromic, inside one docker exec. The base slots then came back 0.03-0.06%
        apart, tighter than round 1 achieved in-process.
    - attempt: 2
      error: "no matching matrix core intrinsic for wmma version 3 with instruction shape [0, 0, 128] and element types A='bf16', B='bf16', C='f32', at tl.dot(k, qT) and tl.dot(v, tl.trans(do))"
      root_cause: >
        BLOCK_M1=16 with BLK_SLICE_FACTOR=2 gives MASK_BLOCK_M1=8, and the wmma is
        16x16x32 with no fragment below it. BLOCK_M < 16 is illegal on this arch. It
        still COMPILES and RUNS, at 39.45 ms and 81.9 dB -- so the diagnostic must not
        be read as "correct but slow". Sweep point discarded.
    - attempt: 3
      error: "TypeError: unsupported operand type(s) for +: 'int' and 'tuple' in triton.cdiv"
      root_cause: >
        census_gate.py's tile override returned a 2-tuple; fused_backward_tile returns a
        SCALAR BLOCK_N1 which dense_fused_backward assigns to both BLOCK_N1 and BLOCK_M2.
        One-line fix, in the instrument rather than in the kernel.

abandoned:
  # Present for route row 2 only. The ROUND's outcome is `delivered` -- r2.i2.g9 was
  # built, measured and left in the working copy. This records the row that was not
  # built, because its mechanism is the largest thing the round produced.
  mechanism: >
    In the dk/dv pass, do not buy register residency with Q/dO traffic -- the exchange
    rate is already measured and it is bad. Halving BLOCK_N1 to 128 halves every
    resident tile and removes the spill ENTIRELY (vgpr_spill_count 0, scratch 0 B/lane,
    vgpr_count 771 so not even an s_set_vgpr_msb tax), and it is still 20-33% SLOWER
    than the 266-spill incumbent, because every Q and dO block is then read by twice as
    many K/V blocks. Route row 2 (split HEAD_DIM so dk/dv halve) pays exactly that
    traffic and buys LESS: HEAD_DIM is the free axis of dk and dv but the CONTRACTION
    axis of qkT = dot(k, qT) and dpT = dot(v, trans(do)), so k and v stay fully resident
    and the real accounting is 768 -> 512, not the 768 -> 384 the route claimed -- plus
    +50% wmma from recomputing qkT and dpT in each half-pass. BLOCK_N1=128 is a strictly
    better version of the same bet and it loses, so row 2 is dominated by an
    already-measured point. This also kills r1.i7.g7 in its "re-read K/V from LDS" form
    and the whole "recompute instead of keeping a tile live" family that r1.i4.g4 kept
    generating. The remaining live direction is anything that lowers residency at
    CONSTANT Q/dO traffic -- inside one pass over the m-loop, not by running it twice.
  evidence:
    - "rounds/002/1-opt/raw/gate_tile128.txt: BLOCK_N1=BLOCK_M2=128 -> vgpr_count=771 vgpr_spill_count=0 sgpr_spill_count=0 scratch_B_per_lane=0 scratch_load=0"
    - "rounds/001/1-opt/opt.md: the same tile-128 configuration measures 11.8-13.3 ms against the incumbent's 8.69 ms"
    - "rounds/002/1-opt/raw/census_arms.txt: base 266 spills / 8.691 ms, armA 307 / 9.347, armB 325 / 9.302 -- all at BLOCK_N1=256, which is why the law looked monotone"
    - "fused_mha_bwd_kernel.py:_bwd_dkdv_inner -- qkT = tl.dot(k, qT) and dpT = tl.dot(v, tl.trans(do)) both contract over HEAD_DIM, so a half-pass holding only k[:, :64] cannot form qkT at all"
  stage: look
