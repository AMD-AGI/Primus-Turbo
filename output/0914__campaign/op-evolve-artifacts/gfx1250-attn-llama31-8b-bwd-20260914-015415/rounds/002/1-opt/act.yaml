    - "instruction histogram of one unmasked dk/dv iteration (changed the decision: 363 s_set_vgpr_msb vs 128 wmma -- 37% of the loop body is register-pressure overhead, 9.1% is matrix work -- which is what selected both arms)"
    - "TTGIR scf.for iter_args inspection (changed the decision twice: killed the dk_pe/dq_pe dead-alias candidate for free before it was proposed, and identified the loop-carried pointer tensors that became arm B)"
    - "in-process config sweep, BLK_SLICE_FACTOR and BLOCK_M1/BLOCK_N2 decoupled (changed the decision: killed pool item r1.i5.g5 at +2.3% and closed a newly-available degree of freedom -- _check_block_invariant's BLOCK_M1==BLOCK_N2 rule is over-strict, and every point in the freed direction loses)"
    - "op/benchmark.py palindromic multi-arm session, one process per arm (the round's measurement; also established the 0.03-0.08% session floor)"
    - "null-arm control: a byte-identical copy of the incumbent directory, measured in the same session shape (changed the decision: it read 8.686 vs 8.691, proving both arms' ~7% losses were the edits and not the harness -- two independent edits losing by the same amount demanded that check)"
    - "census_gate.py on BLOCK_N1=128 (route row 1; changed the decision decisively -- zero spills and 20-33% slower FALSIFIED this round's own spill-count law across tiles and killed route row 2 before it was built)"
    - "rocprofv3 --stats: NOT re-run. Round 1 established it records zero dispatches on this part and the counter surface is 13/51 non-zero with no byte counter at any level. The .amdgcn replaced it and cost nothing."
  consulted: []
  # Empty, and honestly so. route.md named both of this round's rows by id, and the
  # two arms came from instruments taken on this job's own binary rather than from a
  # recipe. Flagging it as the risk the schema says it is: round 3 should open the
  # corpus, because the live direction this round leaves behind -- lower residency at
  # CONSTANT Q/dO traffic -- is exactly the kind of thing the cross-backend attention
  # recipes may already answer, and nothing in this job's pool does.
  bound: compute
  confidence: medium
  why: >
    Refined this round, and the refinement is measured rather than argued. At the
    shipped tile the kernel is instruction-issue bound: one unmasked dk/dv iteration is
    1400 instructions of which 128 (9.1%) are v_wmma and 517 (37%) are register-pressure
    overhead -- 363 s_set_vgpr_msb, 84 v_nop, 77 scratch_load -- which is consistent
    with 633 TF/s against a 2236-2667 TF/s bf16 GEMM and with 154 GB/s, nowhere near
    bandwidth. Round 1's `power` is still true underneath (2497-2502 W of a 2500 W cap,
    GFX clock 29% below max) and is why deleting instructions is the only thing that can
    pay; it is not the proximate binding constraint on this configuration. The one place
    memory binds is the TILE CHOICE, not the tile: BLOCK_N1=128 removes the spill
    entirely (vgpr_spill_count 0, vgpr_count 771) and is still 20-33% slower, because
    halving the K/V tile doubles Q/dO traffic in the dk/dv pass. Confidence is medium
    and not high because this part has no byte counter at any level and its entire WMMA
    FLOP counter family reads exactly 0, so none of this is counter-derived -- it is
    read off the ISA and off end-to-end times.

arms:
  - id: r2.i1.g8
    built: "A alone, from op/current -- fold sm_scale into the exp2 argument's own constant in _bwd_dkdv_inner and _bwd_dq_inner, deleting a full elementwise pass over the fp32 score tile"
    tflops: {b4_s8192_hq32_hkv8_d128: 587.9}
    vs_champion: 0.9294
    shipped: false
    note: >
      LOST, 9.3466 ms vs the incumbent's 8.6912 in the same session (+7.5%, against a
      0.03-0.06% floor). It did exactly what it was designed to do -- v_pk_mul_f32 fell
      448 -> 416, precisely the 32 targeted -- and paid 41 more spilled VGPRs
      (266 -> 307) for them, because folding a short-lived value into a longer
      expression extends the live range of what it was consuming, and at 1024 of 1024
      VGPRs there is no slack to absorb that.
  - id: r2.i2.g9
    built: "B alone, from op/current -- NOT on top of A -- loop-invariant offset tensors plus a scalar row cursor added at the load, replacing the loop-carried tensor<128x32xi32> pointer iter_args"
    tflops: {b4_s8192_hq32_hkv8_d128: 591.6}
    vs_champion: 0.9345
    shipped: true
    note: >
      LOST, 9.3021 ms (+7.0%), and it did NOT even get the instruction it was after:
      v_add went UP, 115 -> 124. Triton's pointer-tensor increment is one add on a
      value the allocator keeps coalesced; ptr + scalar*stride re-materialises the full
      address tensor at each load instead. 59 more spills (266 -> 325). Shipped as the
      best arm, as the rule requires when every arm loses, and left in the working copy.
  - id: r2.i1.g8+r2.i2.g9
    built: "NOT BUILT"
    shipped: false
    note: >
      No merge. The rule builds one only when neither arm lost; both lost, and a merge
      is measured rather than inferred, so building it would have spent the round's GPU
      budget confirming that two edits costing 41 and 59 spills cost both together.
  - id: r2.i3.g10
    built: "route row 1 (must) -- the spill gate, delivered as rounds/002/1-opt/census_gate.py"
    shipped: false
    note: >
      Not an arm with a time; an instrument, and the round's most useful output. It
      falsified its own premise on the first candidate it was pointed at: BLOCK_N1=128
      censuses at vgpr_spill_count 0, scratch 0 B/lane, vgpr_count 771, and round 1
      TIMED it at 11.8-13.3 ms. So the spill law holds only at a FIXED tile -- the four
      monotone points were all at BLOCK_N1=256 -- and across tiles Q/dO traffic
      dominates register pressure. Cost: one compile, no timing run.
  - id: r2.i4.g11
    built: "route row 2 -- NOT BUILT, gated out by row 1"
    shipped: false
    note: >
      See abandoned.mechanism. Row 1's stated job was to gate rows 2-3 and it did.

