abandoned:
  mechanism: >
    Route row 1 was stochastic PC sampling, the corpus's stated replacement for the 38 dead
    gfx1250 counters and the round's gate on rows 2-3. It does not run on this kernel, and it
    fails in two different ways depending on the sampling interval, which is what identifies
    the mechanism rather than a flake. At interval 2048 cycles the GPU takes a page fault
    inside the sampled process -- "Memory access fault by GPU node-3 ... Reason: Page not
    present or supervisor privilege", followed by "GPU core dump skipped because PC Sampling
    active" and SIGABRT in rocprofv3's own signal handler; the tool then hangs in finalisation
    with "Timeout while waiting for queue sync: 1 kernels still active". At interval 1048576,
    the coarsest the part accepts, there is no fault at all and instead the process wedges
    before emitting a single sample: alive for 13 minutes with GPU[1] at 0% utilisation, no
    CSV written, no output past tool initialisation. So the failure is not the sampling rate
    and not this kernel's arithmetic -- it is that the PC-sampling interrupt path cannot be
    unwound for a kernel that is resident at 1024 of 1024 VGPRs with 1064 B/lane of scratch
    on a single wave per SIMD: sample and it faults on the save area, do not sample and the
    queue never drains. This is the same family as the already-recorded finding that
    rocprofv3 --stats --kernel-trace exits 0 with zero dispatches on this benchmark, and it
    closes the last instrument the corpus offered for this part. Consequence for the route:
    row 2 (r1.i7.g7) was explicitly gated on this reading byte-bound and must not be opened
    on an inference, and row 3 (r3.i4.g15) had already died on its own free gate -- the
    shipped .amdgcn emits 96 buffer_store_b128 and ZERO buffer_store_b64, so the dk/dv
    epilogue is already at maximum store width and the corpus's +12.09% LDS-staged-epilogue
    mechanism has nothing here to widen. Both arms the table could reach were therefore
    unreachable for reasons the table itself specified, and no code was written.
  evidence:
    - "raw/pcsample_attempt1.txt -- interval 2048: 'Memory access fault by GPU node-3 (Agent handle: 0xdf4aee0) on address 0x7f9cad2f4000. Reason: Page not present or supervisor privilege.' / 'GPU core dump skipped because PC Sampling active' / 'rocprofv3 caught signal 6' / 'Timeout while waiting for queue sync: 1 kernels still active'"
    - "raw/pcsample_attempt2.txt -- interval 1048576: no fault, no samples, no CSV; process alive 13 min with GPU[1] at 0% use, output file unmodified since tool initialisation; killed"
    - "device verified healthy after both attempts: rocm-smi GPU[1] 0% use, no KFD PIDs, and a 4096^3 bf16 matmul returns correctly"
    - "route row 3 gate, one grep of the shipped bwd_kernel_causal.amdgcn: 96 buffer_store_b128, 0 buffer_store_b64, 160 ds_store_b128, 46 scratch_store_b128, 82 scratch_store_b32"
  stage: look
