implementation:
  files_changed: [rounds/018/op/kernels.py]
  build_failures:
    - attempt: 1
      error: "6 global_load_async_to_lds_b32 emitted, 0 s_wait_asynccnt"
      root_cause: >
        The backend does not derive the async wait from the memory dependence: the LDS
        destination is an inttoptr address and is opaque to it. The ds_load consumer could
        race the async write. All four offline screens returned verdict pass, spill 0 on it.
        Fixed by writing rocdl.s_wait_asynccnt(2 if carry else 0) explicitly, with the count
        chosen so the full body does NOT drain its just-issued pair (that is r10.i1.g27's
        failure) and the masked body does.
    - attempt: 2
      error: "op/validation.py FAIL: dk -56.23/-67.22/-73.14 dB, dv -54.60/-66.03/-72.07 dB (dq 52.6 dB, untouched)"
      root_cause: >
        The LDS destination operand of global_load_async_to_lds_b32 is PER LANE -- lane l
        writes its own dword at the address its own VGPR holds, with NO implicit lane stride.
        _ldslot(qt, gh) is built only from lds_ld, qt, gh and G, so all 32 lanes passed the
        same address, collided on the same 4 bytes, and 31 of 32 values were dropped; the
        consumer's _sl + row*4 then read LDS that was never written for every row >= 1. This
        is the old gfx90a/gfx940 global_load_lds contract (uniform LDS base via m0, hardware
        strides by lane) applied to the gfx1250 async op, which does not have it -- that is
        the price of not needing m0 and not requiring uniformity. Fixed with
        _sl = _ldslot(qt, gh) + lane * fx.Int32(4).
  note: >
    The compile cache was cleared before the first build of this round
    (rm -rf /root/.flydsl/* ~/.cache/comgr/*, 253 MB + 77 MB, plus the working copy's
    __pycache__), so no measurement here can be a stale binary from round 17.
