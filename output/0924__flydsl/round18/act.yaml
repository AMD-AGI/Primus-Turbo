expected: >
  I did not write a TFLOP/s prediction before measuring, and I am not going to invent one now.
  What opt.md section 9 does carry, under the heading "One thing the ISA shows that I do not
  like, recorded before measuring", is this, verbatim:

  ".LBB0_8 now opens with the 2 async loads at slots 49-51 and then an s_wait_loadcnt 0x0 at
  slot 54, before the body's first buffer_load_b128 (slot ~93). The allocator gave the async
  ops' address registers v4/v5, and the b128 batch later writes v[2:5] -- so this is a WAR
  drain of the previous iteration's b128, newly introduced by register reuse. It is a full
  LOADcnt drain at the top of the hot body. It may cost more than the 470 cycles removed. If
  the card says g56 loses, that is the first thing to look at, and it is fixable by keeping
  the async address out of the b128 batch's register range rather than by abandoning the
  mechanism."

  That was a falsifiable statement and the round falsified it. Build #3 has the two async
  loads at .LBB0_8 slots 48/49 and the first s_wait_loadcnt 0x0 at slot 52 -- and the body
  carries 2 of them, exactly as the incumbent does. No drain was added. The candidate still
  lost 6.84%. So the WAR was not the cost, and the thing I flagged as the first place to look
  has been looked at and cleared.
  # The absence of a number here is itself the finding to carry: this round had a stall
  # attribution precise enough to name one site and price it at 470 of 562 cycles, and it
  # still could not be turned into a throughput prediction. Round 19 should write one down.

