explored:
  ran: []
  # No rocprofv3 this round, and that is a decision, not an omission: h4 is a standing
  # constraint that rocprofv3 is a dead end on this op (three faults, one power-cycle), and
  # round 17's kernel.yaml already fixes the dispatch set per shape. What replaced it was
  # rounds/018/_scratch/scr/attrib_ss.py (steady-state stall attribution, ncopy=4, zero card
  # time). It changed two decisions: it re-confirmed the 2048 FLOP/SIMD-cycle WMMA rate by an
  # independent route (30.4% matrix busy vs the 29.5% back-solved from throughput), which
  # voided round 17's `bound: compute`; and it put 470 of .LBB0_8's 562 stall cycles on ONE
  # site, which is what selected this round's candidate.
  consulted:
    - backends/flydsl/attention/dead-ends.md
    - optimization/techniques/6-gfx1250-cdna5-mechanisms.md
    - backends/hipkittens/gemm/recipes/bf16_gfx1250_ladder.md
  bound: latency
  confidence: medium
  # latency, not compute and not memory. Compute is out: the 2048 rate is now confirmed twice
  # and matrix busy in the hot body is 30.4%. Memory is out: this round moved 16 bytes per
  # iteration off one queue and lost 6.84%, while the 512 bytes of b128 in the same body were
  # untouched -- the eighth piece of counter-evidence against h8's byte-count story.
  # confidence medium rather than high because the round's own candidate falsified the
  # sharpest prediction the latency model made: removing the site that owned 83.6% of the
  # body's stall made the kernel SLOWER. The model locates the stall correctly and prices it
  # wrongly, and the instrument that would settle it (an ASYNCcnt queue in the attribution
  # tool) does not exist yet -- it is row 5 of the route table.
  why: >
    k_dkdv .LBB0_8 at WMMA_cost=8 is 1685 cycles = 512 WMMA (30.4%) + 611 other issue (36.3%)
    + 562 stall (33.4%), and 470 of the 562 are one site (@228 loadcnt N=35) popping a
    buffer_load_b32 stuck behind the 32-deep b128 prefetch in the in-order LOADcnt FIFO.
    k_dq's hot body has ZERO stall and 54.3% matrix busy. Per S-element non-WMMA issue is
    0.315 for k_dq against 0.597 for k_dkdv (1.9x); parity would put prod at ~754 TF/s,
    above the bar, without touching the 7/5 structural factor.

