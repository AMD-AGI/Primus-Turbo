explored:
  ran:
    - "offline static screen (COMPILE_ONLY=1 ARCH=gfx1250 FLYDSL_GPU_ARCH=gfx1250 ISA dump) on cur_a / A63 / B65 / B66"
    - "per-basic-block ISA census + in-body positional map of every s_wait_* (scr/blocks.py, scr/pos.py)"
