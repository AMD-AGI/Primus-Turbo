implementation:
  files_changed: [rounds/022/op/kernels.py]
  build_failures:
    - attempt: 1
      error: "ls rounds/022/_scratch/scr/dump_$t/*k_dq*.s -- no such file (rc=2, no artefact parsed)"
      root_cause: >
        The offline screen writes one directory per kernel (dump_X/k_dq_0/21_final_isa.s), not
        flat per-kernel .s files at the top level. The glob matched nothing and would have made
        an empty ISA census look like a kernel with zero loads. Fixed by copying */21_final_isa.s
        out by directory name. Zero card time -- it failed in the shell, before any build.
    - attempt: 2
      error: "dmesg Monitor emitted the entire boot log as a single event"
      root_cause: >
        The HOST kernel cmdline carries modprobe.blacklist=amdgpu, so host dmesg contains no
        amdgpu events at all and a host-side monitor can only ever replay the boot log. GPU
        health has to be read from INSIDE the container. Fixed by dropping the host monitor and
        relying on the bounded in-container `dmesg | tail -3` that val.sh/meas.sh already run
        between GPU blocks per h15. Recorded because it will mislead any future round that arms
        a host-side dmesg watch on this box.
  note: >
    No compile failures. All four builds (cur_a, cur_b rebuilt incumbents, A68, B67, P70)
    screened clean with verdict pass and spill 0; h3 never fired. The compile cache
    (/root/.flydsl) and every __pycache__ under rounds/ were purged before the shipped copy
    was rebuilt and re-validated, so no measurement in this round can be serving a previous
    round's binary.
